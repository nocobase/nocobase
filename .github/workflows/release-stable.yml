name: Release Stable

# Stable releases normally publish main to the latest dist-tag. A hotfix from an older branch must set keep_latest so
# that it publishes to legacy without moving latest backwards.
#
# The workflow supports two sources. A promotion from beta already contains the final versions and has no pending
# changesets. A direct stable patch or hotfix still has changesets, so prepare computes and commits its versions on an
# isolated release branch. Both paths build and pack once, fan out create-app smoke tests, and publish those exact
# artifacts only after all smoke runners pass.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        type: string
        default: main
      keep_latest:
        description: 'Keep the latest dist-tag untouched (check this for hotfixes on older versions; publishes to legacy)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: compute versions and run checks without publishing or pushing'
        type: boolean
        default: false
      skip_smoke_test:
        description: 'Skip the create-app smoke test (use only when the smoke test itself is broken)'
        type: boolean
        default: false

concurrency:
  group: release-write
  cancel-in-progress: false

permissions:
  contents: read

# prepare versions the release and saves it as release-source-state. build and test both restore that state and run in
# parallel: tests read workspace packages from source, so they never needed the build output, and running them after
# the build only added their duration to every release.
jobs:
  prepare:
    name: Prepare stable release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: release-source
    outputs:
      tag: ${{ steps.batch.outputs.name }}
      batch: ${{ steps.batch.outputs.value }}
      branch: ${{ steps.batch.outputs.name }}
      rows: ${{ steps.changed.outputs.rows }}
      base_sha: ${{ steps.base.outputs.sha }}
      source_sha: ${{ steps.state.outputs.source_sha }}
      has_changes: ${{ steps.state.outputs.has_changes }}
      dist_tag: ${{ steps.disttag.outputs.value }}
      needs_version: ${{ steps.mode.outputs.needs_version }}
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: release-source
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          registry-url: https://npm.nocobase.ai
          scope: '@nocobase'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record the release base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify branch is not in pre mode
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::$BRANCH carries .changeset/pre.json — the stable line is contaminated, aborting"
            exit 1
          fi

      - name: Reject develop
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$BRANCH" = "develop" ]; then
            echo "::error::Use release-beta.yml to release from develop"
            exit 1
          fi

      - name: Resolve dist-tag
        id: disttag
        env:
          BRANCH: ${{ inputs.branch }}
          KEEP: ${{ inputs.keep_latest }}
        run: |
          if [ "$KEEP" = "true" ]; then
            echo "value=legacy" >> "$GITHUB_OUTPUT"
            echo "dist-tag: legacy (the latest pointer stays where it is)"
          else
            if [ "$BRANCH" != "main" ]; then
              echo "::error::Releasing from $BRANCH without keep_latest checked."
              echo "If this is a hotfix for an older version, check keep_latest and run again."
              exit 1
            fi
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "dist-tag: latest"
          fi

      - name: Decide version mode
        id: mode
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "0 changesets — versions are already ready to publish"
            echo "needs_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "$COUNT changesets — versions need to be computed"
            echo "needs_version=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify there is something to publish
        if: steps.mode.outputs.needs_version == 'false'
        run: |
          echo "Publish candidates:"
          node scripts/list-package-versions.mjs --candidates
          echo "The publish plan will query the registry and omit versions already published."

      - name: Configure git
        run: |
          git config user.name "nocobase[bot]"
          git config user.email "179432756+nocobase[bot]@users.noreply.github.com"

      - name: Snapshot versions before versioning
        if: steps.mode.outputs.needs_version == 'true'
        run: node scripts/list-package-versions.mjs > /tmp/versions-before.json

      - name: Allocate the release batch
        id: batch
        run: |
          git fetch --tags --force
          DAY=$(date -u +%Y-%m-%d)
          MAX=0
          for t in $(git tag -l "release/${DAY}.*"); do
            N="${t##*.}"
            case "$N" in ''|*[!0-9]*) continue ;; esac
            [ "$N" -gt "$MAX" ] && MAX="$N"
          done
          SEQ=$((MAX + 1))
          BATCH="${DAY}.${SEQ}"
          {
            echo "name=release/${BATCH}"
            echo "value=$BATCH"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $BATCH"

      - name: Version packages
        if: steps.mode.outputs.needs_version == 'true'
        run: pnpm changeset version

      - name: Sync template version
        run: node ./scripts/sync-template-version.mjs

      - name: Verify versions actually changed
        if: steps.mode.outputs.needs_version == 'true'
        id: changed
        run: |
          CHANGED=$(node scripts/list-package-versions.mjs --changed /tmp/versions-before.json)
          if [ -z "$CHANGED" ]; then
            echo "::error::changeset version changed no versions (they may all be empty changesets)"
            exit 1
          fi
          echo "$CHANGED"
          echo "rows=$(node scripts/list-package-versions.mjs --released-rows /tmp/versions-before.json)" >> "$GITHUB_OUTPUT"

      - name: Verify no prerelease versions
        run: |
          LEFT=$(node scripts/list-package-versions.mjs --prerelease)
          if [ -n "$LEFT" ]; then
            echo "::error::Prerelease versions should not exist on a stable release: $LEFT"
            exit 1
          fi

      - name: Summarize
        run: |
          {
            echo "### Stable release"
            echo
            echo "| Package | Version |"
            echo "| --- | --- |"
            node scripts/list-package-versions.mjs --table
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save prepared release source
        id: state
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BATCH_TAG: ${{ steps.batch.outputs.name }}
          BATCH: ${{ steps.batch.outputs.value }}
        run: |
          TEMPLATE_VERSION=$(node -p "require('./packages/templates/app-template-default/package.json').version")
          RELEASE_MESSAGE=$(printf 'chore: release %s [skip ci]\n\ncurrent app-template-default version: %s' "$BATCH" "$TEMPLATE_VERSION")
          node ../scripts/release-state.mjs save \
            --directory "$RUNNER_TEMP/release-state" \
            --base "$BASE_SHA" \
            --branch "$BATCH_TAG" \
            --message "$RELEASE_MESSAGE"

      - name: Upload prepared release source
        uses: actions/upload-artifact@v4
        with:
          name: release-source-state
          path: ${{ runner.temp }}/release-state
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Build and pack stable release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Check out the release base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: release-source
          fetch-depth: 0

      - name: Download prepared release source
        uses: actions/download-artifact@v4
        with:
          name: release-source-state
          path: ${{ runner.temp }}/release-state

      - name: Restore prepared release source
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node ../scripts/release-state.mjs restore \
            --directory "$RUNNER_TEMP/release-state" \
            --base "$BASE_SHA" \
            --expected "$SOURCE_SHA" \
            --branch "$BATCH_TAG"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          registry-url: https://npm.nocobase.ai
          scope: '@nocobase'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Templates publish their sources rather than a dist, and the smoke jobs build applications generated from the
      # packed templates, so building the templates here produced nothing a release uses. They were half the build.
      - name: Build
        run: NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD=1 pnpm -r --if-present --filter '!./packages/templates/**' build

      # The build above already produced every dist, so pack:check skips the build half of each prepack script.
      - name: Pack packages for create-app smoke tests
        env:
          PACK_DIR: ${{ runner.temp }}/release-smoke-packages
          PACK_CHECK_PREBUILT: '1'
        run: pnpm pack:check

      - name: Create publish plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          PLAN="$RUNNER_TEMP/release-pack/publish-plan.json"
          pnpm changeset publish-plan --output "$PLAN"

          ARGS=(
            --plan "$PLAN"
            --artifacts "$RUNNER_TEMP/release-smoke-packages"
            --output "$RUNNER_TEMP/release-pack"
            --repo-root "$PWD"
          )
          if [ -n "$DIST_TAG" ]; then
            ARGS+=(--tag "$DIST_TAG")
          fi
          node ../scripts/prepare-release-pack.mjs "${ARGS[@]}"

      - name: Upload smoke-test packages
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-packages
          path: ${{ runner.temp }}/release-smoke-packages/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-pack
          path: ${{ runner.temp }}/release-pack
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test:
    name: Test stable release (${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: release-source
    strategy:
      fail-fast: false
      matrix:
        shard: [plugins, others]
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Check out the release base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: release-source
          fetch-depth: 0

      - name: Download prepared release source
        uses: actions/download-artifact@v4
        with:
          name: release-source-state
          path: ${{ runner.temp }}/release-state

      - name: Restore prepared release source
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node ../scripts/release-state.mjs restore \
            --directory "$RUNNER_TEMP/release-state" \
            --base "$BASE_SHA" \
            --expected "$SOURCE_SHA" \
            --branch "$BATCH_TAG"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          registry-url: https://npm.nocobase.ai
          scope: '@nocobase'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated applications run the three template suites again against packed packages, so those suites run here
      # only when the smoke test is skipped.
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          INCLUDE_TEMPLATES: ${{ inputs.skip_smoke_test }}
        run: ../scripts/release-test-shard.sh "$SHARD" "$INCLUDE_TEMPLATES"

  smoke:
    name: Create-app smoke (${{ matrix.template }})
    if: '!inputs.skip_smoke_test'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [default, examples, hub]
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Check out the release base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: release-source
          fetch-depth: 0

      - name: Download prepared release source
        uses: actions/download-artifact@v4
        with:
          name: release-source-state
          path: ${{ runner.temp }}/release-state

      - name: Restore prepared release source
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node ../scripts/release-state.mjs restore \
            --directory "$RUNNER_TEMP/release-state" \
            --base "$BASE_SHA" \
            --expected "$SOURCE_SHA" \
            --branch "$BATCH_TAG"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml

      - name: Download smoke-test packages
        uses: actions/download-artifact@v4
        with:
          name: release-smoke-packages
          path: ${{ runner.temp }}/release-smoke-packages

      - name: Verify create-app against the prepared packages
        uses: ./.github/actions/verify-create-app
        with:
          source-directory: release-source
          local-packages-only: 'true'
          template-kind: ${{ matrix.template }}
          package-artifacts: ${{ runner.temp }}/release-smoke-packages

  release:
    name: Publish from ${{ inputs.branch }}
    needs: [prepare, build, test, smoke]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.build.result == 'success' && needs.test.result == 'success'
      && (needs.smoke.result == 'success' || (inputs.skip_smoke_test && needs.smoke.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: release-source
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      merged: ${{ steps.merge.outputs.merged }}
      needs_version: ${{ needs.prepare.outputs.needs_version }}
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Check out the release base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: release-source
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Download prepared release source
        uses: actions/download-artifact@v4
        with:
          name: release-source-state
          path: ${{ runner.temp }}/release-state

      - name: Restore prepared release source
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node ../scripts/release-state.mjs restore \
            --directory "$RUNNER_TEMP/release-state" \
            --base "$BASE_SHA" \
            --expected "$SOURCE_SHA" \
            --branch "$BATCH_TAG"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          registry-url: https://npm.nocobase.ai
          scope: '@nocobase'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "nocobase[bot]"
          git config user.email "179432756+nocobase[bot]@users.noreply.github.com"

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-pack
          path: ${{ runner.temp }}/release-pack

      - name: Validate release packages
        run: |
          node ../scripts/prepare-release-pack.mjs \
            --validate-only \
            --plan "$RUNNER_TEMP/release-pack/publish-plan.json" \
            --output "$RUNNER_TEMP/release-pack" \
            --repo-root "$PWD"

      # A failed publish may have uploaded only part of the original plan. Re-query the registry on every release-job
      # attempt and select the still-unpublished packages from the already tested tarballs, making a failed-job retry
      # safe without rebuilding or assigning a new version.
      - name: Refresh publish plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          PLAN="$RUNNER_TEMP/release-publish/publish-plan.json"
          pnpm changeset publish-plan --output "$PLAN"

          ARGS=(
            --plan "$PLAN"
            --artifacts "$RUNNER_TEMP/release-pack/packages"
            --output "$RUNNER_TEMP/release-publish"
            --repo-root "$PWD"
          )
          if [ -n "$DIST_TAG" ]; then
            ARGS+=(--tag "$DIST_TAG")
          fi
          node ../scripts/prepare-release-pack.mjs "${ARGS[@]}"

      - name: Verify restored release revision
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Note dry run
        if: inputs.dry_run
        run: echo "dry_run=true — prepared artifacts were restored and verified; nothing will be pushed or published."

      - name: Note skipped smoke tests
        if: inputs.skip_smoke_test
        run: echo "::warning::The create-app smoke tests were skipped for this release."

      # Mint the write token after validation so long builds do not consume its one-hour lifetime.
      - name: Create a fresh NocoBase release token
        if: '!inputs.dry_run'
        id: release_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Authenticate git writes as nocobase bot
        if: '!inputs.dry_run'
        env:
          RELEASE_TOKEN: ${{ steps.release_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/nocobase/nocobase3.git"

      - name: Push release branch
        if: "!inputs.dry_run && needs.prepare.outputs.has_changes == 'true'"
        env:
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: git push origin "refs/heads/${BATCH_TAG}:refs/heads/${BATCH_TAG}"

      - name: Tag the release
        if: '!inputs.dry_run'
        env:
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags --force
          HEAD_SHA=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/${BATCH_TAG}^{commit}" > /dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${BATCH_TAG}^{commit}")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::$BATCH_TAG already points to $TAG_SHA instead of $HEAD_SHA"
              exit 1
            fi
            echo "Reusing $BATCH_TAG at $(git rev-parse --short HEAD)"
          else
            git tag "$BATCH_TAG"
            git push origin "refs/tags/${BATCH_TAG}:refs/tags/${BATCH_TAG}"
            echo "Tagged $(git rev-parse --short HEAD) as $BATCH_TAG"
          fi

      - name: Publish to npm
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm changeset publish --from-pack-dir "$RUNNER_TEMP/release-publish"

      - name: Push package tags
        if: '!inputs.dry_run'
        run: git push origin --tags

      - name: Merge back into the release branch
        if: "!inputs.dry_run && needs.prepare.outputs.has_changes == 'true'"
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          RELEASE_BASE: ${{ inputs.branch }}
          BATCH: ${{ needs.prepare.outputs.batch }}
          BATCH_TAG: ${{ needs.prepare.outputs.tag }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          PUBLISH_TAG="${DIST_TAG:-latest}"
          TEMPLATE_VERSION=$(node -p "require('./packages/templates/app-template-default/package.json').version")
          PR_URL=$(gh pr create \
            --title "chore: release $BATCH [skip ci]" \
            --body "Stable release \`$BATCH\` published to npm under the \`$PUBLISH_TAG\` dist-tag. Per-package versions are in the GitHub Release." \
            --base "$RELEASE_BASE" \
            --head "$BATCH_TAG")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          set +e
          gh pr merge "$PR_URL" --merge --delete-branch --subject "chore: merge release $BATCH into $RELEASE_BASE [skip ci]" \
            --body "current app-template-default version: $TEMPLATE_VERSION"
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::warning::Failed to merge the PR back into ${{ inputs.branch }}; conflicts need manual work: $PR_URL"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync into develop
        if: "!inputs.dry_run && inputs.branch == 'main' && needs.prepare.outputs.has_changes == 'true' && steps.merge.outputs.merged == 'true'"
        id: sync
        env:
          BATCH: ${{ needs.prepare.outputs.batch }}
        run: |
          git fetch origin main develop
          git checkout -B develop origin/develop

          set +e
          git merge --no-ff origin/main -m "chore: sync $BATCH into develop [skip ci]"
          MERGE_RC=$?
          set -e

          if [ $MERGE_RC -ne 0 ]; then
            set +e
            node scripts/resolve-sync-conflicts.mjs
            RESOLVE_RC=$?
            set -e
            if [ $RESOLVE_RC -ne 0 ]; then
              git merge --abort
              {
                echo "::warning::Conflicts that cannot be resolved automatically — sync by hand"
                echo
                echo "npm publish succeeded and main is updated; only the sync back to develop failed."
                echo "Remote develop is untouched. Run this locally:"
                echo
                echo "  git checkout develop && git pull"
                echo "  git merge origin/main"
                echo "  node scripts/resolve-sync-conflicts.mjs"
                echo "  # resolve the remaining source conflicts, then commit and push"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "synced=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: sync $BATCH into develop [skip ci]"
          fi

          if [ ! -f .changeset/pre.json ]; then
            echo "::warning::develop lost pre.json after the merge — aborting the push"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin develop
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Notify merge failure
        if: "!inputs.dry_run && needs.prepare.outputs.has_changes == 'true' && steps.merge.outputs.merged == 'false'"
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 稳定版发布成功，但 PR 合回失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            版本 **${{ needs.prepare.outputs.batch }}** 已成功发布到 npm。

            但版本提交合回 `${{ inputs.branch }}` 时发生冲突，需要人工解决：
            ${{ steps.merge.outputs.url }}

            发版分支 `${{ needs.prepare.outputs.tag }}` 已保留。
            **在此之前不要再次发版**，否则版本号会从旧基线重新计算。
        run: ../scripts/feishu-notify.sh

      - name: Notify sync failure
        if: "!inputs.dry_run && inputs.branch == 'main' && needs.prepare.outputs.has_changes == 'true' && steps.merge.outputs.merged == 'true' && steps.sync.outputs.synced == 'false'"
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 稳定版已发布，但同步到 develop 需要人工处理
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            版本 **${{ needs.prepare.outputs.batch }}** 已发布到 npm 并合进 `main`。

            但同步到 `develop` 时有无法自动解决的源码冲突。远端 `develop` 未被修改，请手工合并 `origin/main` 并运行 `node scripts/resolve-sync-conflicts.mjs`。
            **不同步的话，下一次转正会覆盖掉这个补丁。**
        run: ../scripts/feishu-notify.sh

      - name: Fail the run when merge failed
        if: "!inputs.dry_run && needs.prepare.outputs.has_changes == 'true' && steps.merge.outputs.merged == 'false'"
        run: exit 1

      - name: Notify success
        if: "!inputs.dry_run && (needs.prepare.outputs.has_changes != 'true' || steps.merge.outputs.merged == 'true')"
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 稳定版发布
          STATUS: success
          STATUS_TEXT_SUCCESS: 发布成功
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases
          TABLE_JSON: ${{ needs.prepare.outputs.rows }}
          CONTENT: |
            已发布到 npm。

            ${{ needs.prepare.outputs.rows && '本次发布的 package：' || '本次发布的 package 见 GitHub Release。' }}

            ${{ steps.sync.outputs.synced == 'true' && '补丁已同步到 develop。' || '' }}
        run: ../scripts/feishu-notify.sh

      - name: Notify release failure
        if: failure() && !inputs.dry_run && steps.merge.outputs.merged != 'false'
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TITLE: NocoBase 3 稳定版发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发版中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            稳定版发版流程中断。

            如果失败发生在 publish 之前，npm 上没有产生这批版本；请先看构建详情确认 publish 是否执行。
        run: ../scripts/feishu-notify.sh

  notify-validation-failure:
    name: Notify stable validation failure
    needs: [prepare, build, test, smoke]
    if: >-
      always() && !cancelled() && !inputs.dry_run
      && (needs.prepare.result == 'failure' || needs.build.result == 'failure' || needs.test.result == 'failure'
        || needs.smoke.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v4

      - name: Notify failure
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TITLE: NocoBase 3 稳定版发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发版校验中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            稳定版的构建、测试或 create-app 冒烟测试失败，npm 未发布任何内容。修复后可重新触发发版。
        run: ./scripts/feishu-notify.sh

  github-release:
    name: Publish the GitHub Release
    needs: release
    # npm may already be published when merging the prepared source fails, so create the GitHub Release in that case.
    if: >-
      !cancelled() && !inputs.dry_run
      && needs.release.outputs.tag != ''
      && (needs.release.result == 'success' || needs.release.outputs.merged == 'false')
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      NOCOBASE_APP_PRIVATE_KEY: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
