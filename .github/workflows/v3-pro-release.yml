name: V3 Release Pro

# Release Pro on its own, when only Pro has something to release; V3 Release releases Pro together with the open-source
# packages. It runs on public-repository Actions minutes while every branch, tag, PR, and GitHub Release remains in
# nocobase/nocobase3-pro. Commercial source and packages never leave a job as artifacts or caches.
#
# The channel follows Pro's .changeset/pre.json by the rule of scripts/release-channel.mjs, and the open-source commit Pro pins must be in the same channel: a beta (mode pre) publishes under beta and latest and tags release-beta/<batch>; a stable release (no pre.json, or mode exit) publishes under latest, and beta too during the transition from beta, tags release/<batch>, and takes Pro's Latest GitHub Release. .agents/rules/release-channels.md describes the channels.
#
# prepare selects the Pro develop and OSS v3 commits once. Then three jobs start together, each on its own freshly versioned tree of those commits: the check legs run Pro's tests (pnpm release:test, which needs no build) and the create-app smoke test, and release builds Pro (pnpm release:build) for publishing at the same time. Before writing anything, release waits for both legs and requires that each passed on exactly the tree it built (scripts/wait-for-pro-checks.mjs), so the build overlaps the checks instead of following them. The private packages/examples/** are neither built nor tested, as in the joint release.

on:
  workflow_dispatch:
    inputs:
      oss_sha:
        description: 'Exact OSS v3 commit to pin (empty selects v3 once at job start)'
        type: string
        required: false
      dry_run:
        description: 'Build and test without publishing or writing to the Pro repository'
        type: boolean
        default: false
  workflow_call:
    inputs:
      oss_sha:
        description: 'Exact OSS v3 release commit'
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    secrets:
      NOCOBASE_APP_PRIVATE_KEY:
        required: true
      PRO_NPM_REGISTRY:
        required: true
      PRO_NPM_TOKEN:
        required: true
      RELEASE_RESULT_FEISHU_WEBHOOK_URL:
        required: false

concurrency:
  group: pro-release-write
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The branch of nocobase/nocobase3-pro that Pro is developed on, released from, and merged back into. v3-release.yml names it too.
  PRO_BRANCH: develop

jobs:
  prepare:
    name: Select what to release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # v3 (formerly v3-develop), the OSS repository's default branch, which Pro develop tracks.
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      release: ${{ steps.release_state.outputs.release }}
      pro_sha: ${{ steps.commits.outputs.pro_sha }}
      oss_sha: ${{ steps.commits.outputs.oss_sha }}
      channel: ${{ steps.channel.outputs.channel }}
      exiting: ${{ steps.channel.outputs.exiting }}
      branch_prefix: ${{ steps.channel.outputs.branch_prefix }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      dist_tags: ${{ steps.channel.outputs.dist_tags }}
    steps:
      # The Pro checkout below replaces the workspace, so the open-source tooling this job runs is copied out first.
      - name: Check out workflow tooling
        uses: actions/checkout@v4
        with:
          path: .workflow-tools
          persist-credentials: false

      - name: Copy release tooling outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/oss-tools"
          cp .workflow-tools/scripts/pro-release-candidates.mjs .workflow-tools/scripts/release-channel.mjs "$RUNNER_TEMP/oss-tools/"

      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Check out Pro develop
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: ${{ env.PRO_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Configure the Pro read remote
        env:
          PRO_TOKEN: ${{ steps.checkout_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"

      # V3 Release releases Pro with the open-source packages through a release-candidate/<batch> branch. While one is in flight, a Pro release of its own would publish the same versions or take the same release name, so this workflow refuses to start, and checks again just before it writes anything. A candidate older than 30 days is ignored, because its run can no longer be re-run; see scripts/pro-release-candidates.mjs.
      - name: Refuse to run while a joint release is in flight
        run: node "$RUNNER_TEMP/oss-tools/pro-release-candidates.mjs" check

      # Pro's pre.json decides the channel: mode pre is beta, no pre.json or mode exit is stable.
      - name: Choose the release channel
        id: channel
        run: node "$RUNNER_TEMP/oss-tools/release-channel.mjs" --root . --name "Pro $PRO_BRANCH"

      # Leaving prerelease mode (mode exit) releases every package still at a prerelease version, so it needs no pending changeset.
      - name: Inspect release state
        id: release_state
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          EXITING: ${{ steps.channel.outputs.exiting }}
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$COUNT" = 0 ] && [ "$EXITING" != true ]; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo "### Pro $CHANNEL release skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Pro $PRO_BRANCH has no pending changesets, so no package, tag, branch, PR, or Release was created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

      # Every later job, and every re-run of one, checks out and versions exactly these two commits.
      - name: Select the Pro and OSS commits
        if: steps.release_state.outputs.release == 'true'
        id: commits
        env:
          OSS_SHA: ${{ inputs.oss_sha }}
        run: |
          if [ -z "$OSS_SHA" ]; then
            OSS_SHA=$(git ls-remote https://github.com/nocobase/nocobase.git "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          fi
          [[ "$OSS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$OSS_SHA' is not a full OSS commit SHA"; exit 1; }
          echo "Releasing Pro $PRO_BRANCH $(git rev-parse HEAD) with OSS $OSS_SHA."
          {
            echo "pro_sha=$(git rev-parse HEAD)"
            echo "oss_sha=$OSS_SHA"
          } >> "$GITHUB_OUTPUT"

      # The open-source commit Pro is released with must be in the same channel: a Pro beta pinned to a stable open-source release, or the reverse, would leave Pro's peer ranges and dist-tags out of step. Only its .changeset directory is read.
      - name: Verify the OSS commit is in the release channel
        if: steps.release_state.outputs.release == 'true'
        env:
          OSS_SHA: ${{ steps.commits.outputs.oss_sha }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          OSS="$RUNNER_TEMP/oss-channel"
          git init --quiet "$OSS"
          git -C "$OSS" fetch --quiet --depth=1 --no-tags https://github.com/nocobase/nocobase.git "$OSS_SHA"
          mkdir -p "$OSS/.changeset"
          if git -C "$OSS" cat-file -e "FETCH_HEAD:.changeset/pre.json" 2> /dev/null; then
            git -C "$OSS" show "FETCH_HEAD:.changeset/pre.json" > "$OSS/.changeset/pre.json"
          fi
          node "$RUNNER_TEMP/oss-tools/release-channel.mjs" --root "$OSS" --expect "$CHANNEL" --name "OSS $OSS_SHA"

  # The two legs check what release builds and publishes, on runners of their own. Each leg announces the versioned tree it checked as a "Pro checked tree" notice once its check passed; release reads it back before it writes anything. Like release, they upload and cache nothing.
  check:
    name: Check Pro (${{ matrix.part }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [test, smoke]
    steps:
      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Check out the selected Pro commit
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: ${{ needs.prepare.outputs.pro_sha }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Validate the Pro npm registry
        env:
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node -e '
            const value = process.env.PRO_NPM_REGISTRY?.trim();
            if (!value) { console.error("::error::PRO_NPM_REGISTRY is not configured"); process.exit(1); }
            let registry;
            try { registry = new URL(value); } catch { console.error("::error::PRO_NPM_REGISTRY is not a valid URL"); process.exit(1); }
            if (registry.hostname === "registry.npmjs.org") { console.error("::error::Commercial packages must not use public npm"); process.exit(1); }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ secrets.PRO_NPM_REGISTRY }}
          scope: '@nocobase'

      # --branch names the open-source line the pointer follows (develop is v3 to Pro's scripts), not the Pro branch.
      - name: Freeze the OSS v3 snapshot and install
        env:
          OSS_SHA: ${{ needs.prepare.outputs.oss_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
        run: node ./scripts/sync-release-oss.mjs --branch develop --sha "$OSS_SHA"

      # Leaving prerelease mode, the first stable CHANGELOG sections list only what is new since the last beta, as V3 Release writes them.
      - name: Version Pro packages
        env:
          EXITING: ${{ needs.prepare.outputs.exiting }}
        run: |
          node ./vendor/nocobase3/scripts/list-package-versions.mjs > "$RUNNER_TEMP/pro-versions-before.json"
          if [ "$EXITING" = true ]; then
            node ./vendor/nocobase3/scripts/version-first-stable.mjs --root .
          else
            pnpm changeset version
          fi
          CHANGED=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --changed "$RUNNER_TEMP/pro-versions-before.json")
          test -n "$CHANGED" || { echo '::error::Pro changesets changed no package versions'; exit 1; }
          echo "$CHANGED"

      # The index records the versioned tree this leg checks; testing never stages anything.
      - name: Stage the versioned Pro tree
        id: tree
        run: |
          git add -A
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"

      # Pro's tests read source, not builds, so this leg builds nothing; release builds Pro for publishing.
      - name: Test Pro
        if: matrix.part == 'test'
        run: pnpm release:test

      - name: Verify Pro packages in OSS Default
        if: matrix.part == 'smoke'
        uses: ./.github/actions/verify-create-app

      - name: Announce the checked tree
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: echo "::notice title=Pro checked tree::$TREE"

  release:
    name: Publish Pro ${{ needs.prepare.outputs.channel }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # actions and checks: read let it read the check legs' results and annotations of this run.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      # The Pro checkout below replaces the workspace, so the open-source tooling this job runs is copied out first.
      - name: Check out workflow tooling
        uses: actions/checkout@v4
        with:
          path: .workflow-tools
          persist-credentials: false

      - name: Copy release tooling outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/oss-tools"
          cp .workflow-tools/scripts/pro-release-candidates.mjs .workflow-tools/scripts/wait-for-pro-checks.mjs "$RUNNER_TEMP/oss-tools/"

      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Check out the selected Pro commit
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: ${{ needs.prepare.outputs.pro_sha }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Configure the Pro read remote
        env:
          PRO_TOKEN: ${{ steps.checkout_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Validate the Pro npm registry
        env:
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node -e '
            const value = process.env.PRO_NPM_REGISTRY?.trim();
            if (!value) { console.error("::error::PRO_NPM_REGISTRY is not configured"); process.exit(1); }
            let registry;
            try { registry = new URL(value); } catch { console.error("::error::PRO_NPM_REGISTRY is not a valid URL"); process.exit(1); }
            if (registry.hostname === "registry.npmjs.org") { console.error("::error::Commercial packages must not use public npm"); process.exit(1); }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ secrets.PRO_NPM_REGISTRY }}
          scope: '@nocobase'

      - name: Freeze the OSS v3 snapshot and install
        id: oss
        env:
          OSS_SHA: ${{ needs.prepare.outputs.oss_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
        run: node ./scripts/sync-release-oss.mjs --branch develop --sha "$OSS_SHA"

      # The batch number counts today's release tags of both channels, so a beta and a stable release never share a name.
      - name: Configure release branch
        id: branch
        env:
          BRANCH_PREFIX: ${{ needs.prepare.outputs.branch_prefix }}
        run: |
          git config user.name 'nocobase[bot]'
          git config user.email '179432756+nocobase[bot]@users.noreply.github.com'
          node ./vendor/nocobase3/scripts/list-package-versions.mjs > "$RUNNER_TEMP/pro-versions-before.json"
          git fetch origin --tags --force
          DAY=$(date -u +%Y-%m-%d)
          MAX=0
          for TAG in $(git tag -l "release-beta/${DAY}.*" "release/${DAY}.*"); do
            NUMBER="${TAG##*.}"
            case "$NUMBER" in ''|*[!0-9]*) continue ;; esac
            [ "$NUMBER" -gt "$MAX" ] && MAX="$NUMBER"
          done
          BATCH="${DAY}.$((MAX + 1))"
          NAME="${BRANCH_PREFIX}/$BATCH"
          git checkout -b "$NAME"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Leaving prerelease mode, the first stable CHANGELOG sections list only what is new since the last beta, as the check legs wrote them.
      - name: Version Pro packages
        id: changed
        env:
          EXITING: ${{ needs.prepare.outputs.exiting }}
        run: |
          if [ "$EXITING" = true ]; then
            node ./vendor/nocobase3/scripts/version-first-stable.mjs --root .
          else
            pnpm changeset version
          fi
          CHANGED=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --changed "$RUNNER_TEMP/pro-versions-before.json")
          test -n "$CHANGED" || { echo '::error::Pro changesets changed no package versions'; exit 1; }
          echo "$CHANGED"
          echo "rows=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-rows "$RUNNER_TEMP/pro-versions-before.json")" >> "$GITHUB_OUTPUT"

      # The tree the check legs must have passed on. It is recorded before the changelog below, which no build or test reads, so the changelog files are the only part of the release commit the legs did not see.
      - name: Stage the versioned Pro tree
        id: tree
        run: |
          git add -A
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"

      # The root CHANGELOG.md, CHANGELOG.zh-CN.md and CHANGELOG.ja-JP.md gain this release's section, written by the
      # framework's scripts/changelog.mjs from the descriptions of the Pro pull requests the release contains, with
      # Pro's own module names (scripts/changelog-scopes.json, passed once the framework's script takes --scopes); the
      # release commit carries the three files, and the Pro GitHub Release opens with the English section. Best effort:
      # a failure warns, puts the files back as they were, and the release goes on without the section.
      - name: Create a Pro pull request read token
        id: pull_request_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read
          permission-pull-requests: read

      - name: Write the changelog
        env:
          GH_TOKEN: ${{ steps.pull_request_token.outputs.token }}
          TAG: ${{ steps.branch.outputs.name }}
        run: |
          ARGS=(--tag "$TAG" --repo nocobase/nocobase3-pro --root .)
          if [ -f scripts/changelog-scopes.json ] && grep -q -- "scopes: { type: 'string' }" vendor/nocobase3/scripts/changelog.mjs; then
            ARGS+=(--scopes scripts/changelog-scopes.json)
          fi
          if ! node ./vendor/nocobase3/scripts/changelog.mjs "${ARGS[@]}"; then
            echo "::warning::Writing the changelog failed; $TAG has no changelog section."
            for file in CHANGELOG.md CHANGELOG.zh-CN.md CHANGELOG.ja-JP.md; do
              if git ls-files --error-unmatch -- "$file" > /dev/null 2>&1; then
                git checkout HEAD -- "$file"
              else
                rm -f -- "$file"
              fi
            done
          fi

      # Publishing needs the build; a build failure stops the release here, before anything is written.
      - name: Build Pro
        run: pnpm release:build

      - name: Wait for the Pro checks
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: node "$RUNNER_TEMP/oss-tools/wait-for-pro-checks.mjs" --tree "$TREE" --job 'Check Pro (test)' --job 'Check Pro (smoke)'

      - name: Stop after validation
        if: inputs.dry_run
        run: echo 'dry_run=true — no branch, tag, package, PR, or GitHub Release was written.'

      # Installation tokens expire after one hour, so mint the write token only after the long validation phase.
      - name: Create a fresh Pro write token
        if: '!inputs.dry_run'
        id: write_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: write
          permission-pull-requests: write

      - name: Commit, tag, and push the tested candidate
        if: '!inputs.dry_run'
        env:
          PRO_TOKEN: ${{ steps.write_token.outputs.token }}
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"
          node "$RUNNER_TEMP/oss-tools/pro-release-candidates.mjs" check
          git add -A
          test "$(git -C vendor/nocobase3 rev-parse HEAD)" = "$OSS_SHA"
          test "$(git ls-files --stage vendor/nocobase3 | awk '{print $2}')" = "$OSS_SHA"
          git commit -m "chore: release ${{ steps.branch.outputs.batch }} [skip ci]"
          git tag "${{ steps.branch.outputs.name }}"
          git push origin "refs/heads/${{ steps.branch.outputs.name }}:refs/heads/${{ steps.branch.outputs.name }}"
          git push origin "refs/tags/${{ steps.branch.outputs.name }}:refs/tags/${{ steps.branch.outputs.name }}"

      - name: Publish Pro packages
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: node ./scripts/publish-commercial-packages.mjs --registry "$PRO_NPM_REGISTRY" --tag "$DIST_TAG"

      # A beta points latest at each release as well as beta, so installing a Pro package without a tag gets the version
      # that was just published, as the OSS beta release does; a stable release points latest.
      - name: Point the release dist-tags at this release and push package tags
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
          DIST_TAGS: ${{ needs.prepare.outputs.dist_tags }}
        run: |
          node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-specs "$RUNNER_TEMP/pro-versions-before.json" > "$RUNNER_TEMP/pro-released-specs.txt"
          FAILED=0
          while IFS= read -r SPEC; do
            [ -n "$SPEC" ] || continue
            for TAG in $DIST_TAGS; do
              npm dist-tag add "$SPEC" "$TAG" --registry "$PRO_NPM_REGISTRY" || FAILED=1
            done
          done < "$RUNNER_TEMP/pro-released-specs.txt"
          test "$FAILED" = 0 || { echo "::error::One or more Pro $DIST_TAGS dist-tags could not be updated"; exit 1; }
          # publish-commercial-packages.mjs moves a package tag that a candidate which never published had reserved, so the package tags it wrote at the release commit are forced; it refuses to move any other.
          HEAD_SHA=$(git rev-parse HEAD)
          REFS=()
          while IFS= read -r SPEC; do
            [ -n "$SPEC" ] || continue
            if [ "$(git rev-parse --verify --quiet "refs/tags/${SPEC}^{commit}" || true)" = "$HEAD_SHA" ]; then
              REFS+=("+refs/tags/${SPEC}:refs/tags/${SPEC}")
            fi
          done < "$RUNNER_TEMP/pro-released-specs.txt"
          if [ "${#REFS[@]}" -gt 0 ]; then git push origin "${REFS[@]}"; fi

      # Transition: Pro install commands published during the beta say @beta, so for now a stable release points beta at its packages too. Delete this step together with the ones in v3-release.yml once the beta channel is retired.
      - name: 'Transition: point beta at this stable Pro release'
        if: "!inputs.dry_run && needs.prepare.outputs.channel == 'stable'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          FAILED=0
          while IFS= read -r SPEC; do
            [ -n "$SPEC" ] || continue
            npm dist-tag add "$SPEC" beta --registry "$PRO_NPM_REGISTRY" || FAILED=1
          done < "$RUNNER_TEMP/pro-released-specs.txt"
          test "$FAILED" = 0 || { echo '::error::One or more Pro beta dist-tags could not be updated'; exit 1; }

      - name: Merge release metadata back into Pro develop
        if: '!inputs.dry_run'
        id: merge
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          LABEL: ${{ needs.prepare.outputs.channel == 'stable' && 'Stable release' || 'Prerelease' }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          PR_URL=$(gh pr create --repo nocobase/nocobase3-pro \
            --title "chore: release ${{ steps.branch.outputs.batch }}" \
            --body "$LABEL \`${{ steps.branch.outputs.batch }}\` published under \`$DIST_TAG\` using OSS commit \`${{ steps.oss.outputs.sha }}\`." \
            --base "$PRO_BRANCH" --head "${{ steps.branch.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge --repo nocobase/nocobase3-pro "$PR_URL" --merge --delete-branch

      # A beta is a prerelease and leaves Pro's Latest release alone; a stable release takes it.
      - name: Create the Pro GitHub Release
        if: "!inputs.dry_run && steps.merge.outcome == 'success'"
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          TAG: ${{ steps.branch.outputs.name }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [ "$CHANNEL" = stable ]; then FLAGS=(--latest); else FLAGS=(--prerelease --latest=false); fi
          node ./vendor/nocobase3/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/pro-release-notes.raw.md"
          sed -e 's#https://github.com/nocobase/nocobase3/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' \
              -e 's#https://github.com/nocobase/nocobase/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' "$RUNNER_TEMP/pro-release-notes.raw.md" > "$RUNNER_TEMP/pro-release-notes.md"
          TITLE="${TAG##*/}"
          if gh release view --repo nocobase/nocobase3-pro "$TAG" > /dev/null 2>&1; then
            gh release edit --repo nocobase/nocobase3-pro "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" "${FLAGS[@]}"
          else
            gh release create --repo nocobase/nocobase3-pro "$TAG" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" "${FLAGS[@]}"
          fi

      - name: Notify success
        if: '!inputs.dry_run && success()'
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          REGISTRY_URL: ${{ secrets.PRO_NPM_REGISTRY }}
          TITLE: NocoBase 3 Pro ${{ needs.prepare.outputs.channel == 'stable' && '正式版' || '预览版' }}发布
          STATUS: success
          STATUS_TEXT_SUCCESS: 发布成功
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/nocobase/nocobase3-pro/releases
          TABLE_JSON: ${{ steps.changed.outputs.rows }}
          CONTENT: 版本 **${{ steps.branch.outputs.batch }}** 已发布到私有 npm（${{ needs.prepare.outputs.channel == 'stable' && 'dist-tag `latest`，过渡期内 `beta` 也指向它' || 'dist-tag `beta` 和 `latest`' }}）。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh

  # Reports a failure of any job. It checks out only this repository's tooling, so it works however early the release failed.
  notify-failure:
    name: Notify failure
    needs: [prepare, check, release]
    if: failure() && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Notify failure
        if: '!inputs.dry_run'
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          TITLE: NocoBase 3 Pro ${{ needs.prepare.outputs.channel == 'stable' && '正式版' || '预览版' }}发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发版中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: 请检查 OSS 仓库中的 Pro 发版运行；若 publish 已执行，重跑前先确认私有 registry 状态。
        run: ./scripts/feishu-notify.sh
