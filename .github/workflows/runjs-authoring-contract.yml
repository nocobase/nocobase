name: RunJS authoring contract

on:
  workflow_dispatch:
  push:
    branches:
      - improve-runjs-modules
    paths:
      - 'packages/core/runjs/**'
      - 'packages/core/runjs-workspace/**'
      - 'packages/core/cli/**'
      - 'packages/core/cli-v1/**'
      - 'packages/core/client-v2/**'
      - 'packages/core/client/**'
      - 'packages/core/build/**'
      - 'packages/plugins/@nocobase/plugin-flow-engine/**'
      - 'packages/plugins/@nocobase/plugin-light-extension/**'
      - 'packages/presets/nocobase/**'
      - 'tsconfig.paths.json'
      - 'yarn.lock'
      - 'scripts/runjs-authoring-contract-tests.sh'
      - '.github/workflows/runjs-authoring-contract.yml'
  pull_request:
    paths:
      - 'packages/core/runjs/**'
      - 'packages/core/runjs-workspace/**'
      - 'packages/core/cli/**'
      - 'packages/core/cli-v1/**'
      - 'packages/core/client-v2/**'
      - 'packages/core/client/**'
      - 'packages/core/build/**'
      - 'packages/plugins/@nocobase/plugin-flow-engine/**'
      - 'packages/plugins/@nocobase/plugin-light-extension/**'
      - 'packages/presets/nocobase/**'
      - 'tsconfig.paths.json'
      - 'yarn.lock'
      - 'scripts/runjs-authoring-contract-tests.sh'
      - '.github/workflows/runjs-authoring-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runjs-authoring-contract-cross-repo:
    name: RunJS authoring contract cross-repo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout NocoBase
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Skills contract branch
        uses: actions/checkout@v4
        with:
          repository: nocobase/skills
          ref: improve-runjs-modules
          path: .cross-repo/skills
          persist-credentials: false

      - name: Record exact checkout SHAs
        shell: bash
        run: |
          set -euo pipefail
          nocobase_sha="$(git rev-parse HEAD)"
          skills_sha="$(git -C .cross-repo/skills rev-parse HEAD)"
          echo "NocoBase SHA: $nocobase_sha"
          echo "Skills SHA: $skills_sha"
          {
            echo '### RunJS authoring contract checkouts'
            echo "- NocoBase: \`$nocobase_sha\`"
            echo "- Skills: \`$skills_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install NocoBase dependencies
        run: |
          yarn install --frozen-lockfile
          yarn add sqlite3 --no-save -W

      - name: Run NocoBase contracts
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: /tmp/runjs-authoring-contract.sqlite
          LOGGER_LEVEL: error
        run: bash scripts/runjs-authoring-contract-tests.sh

      - name: Run Skills contracts
        run: npm --prefix .cross-repo/skills/skills/nocobase-ui-builder/runtime test

      - name: Verify cross-repository product contract
        env:
          NOCOBASE_REPO: ${{ github.workspace }}
        run: npm --prefix .cross-repo/skills/skills/nocobase-ui-builder/runtime run test:product-contract
