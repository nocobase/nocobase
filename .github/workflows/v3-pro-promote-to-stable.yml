name: V3 Promote Pro Beta to Stable

# Removes prerelease versions in nocobase/nocobase3-pro, merges them into Pro main, then returns the promoted
# versions to Pro develop and re-enters prerelease mode. This workflow does not publish packages.

on:
  workflow_dispatch:
    inputs:
      oss_sha:
        description: 'Exact OSS main commit to pin (empty selects main once at job start)'
        type: string
        required: false
      dry_run:
        description: 'Build and test without writing to the Pro repository'
        type: boolean
        default: false
  workflow_call:
    inputs:
      oss_sha:
        description: 'Exact promoted OSS main commit'
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    secrets:
      NOCOBASE_APP_PRIVATE_KEY:
        required: true
      PRO_NPM_REGISTRY:
        required: true
      RELEASE_RESULT_FEISHU_WEBHOOK_URL:
        required: false

concurrency:
  group: pro-release-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote Pro beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Preserve trusted release tooling
        uses: actions/checkout@v4
        with:
          path: .workflow-tools
          persist-credentials: false

      - name: Copy release tooling outside the checkout
        run: cp .workflow-tools/scripts/reconcile-pro-release-metadata.mjs "$RUNNER_TEMP/reconcile-pro-release-metadata.mjs"

      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Check out Pro develop
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: develop
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Configure the Pro read remote
        env:
          PRO_TOKEN: ${{ steps.checkout_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Validate the Pro npm registry
        env:
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node -e '
            const value = process.env.PRO_NPM_REGISTRY?.trim();
            if (!value) { console.error("::error::PRO_NPM_REGISTRY is not configured"); process.exit(1); }
            let registry;
            try { registry = new URL(value); } catch { console.error("::error::PRO_NPM_REGISTRY is not a valid URL"); process.exit(1); }
            if (registry.hostname === "registry.npmjs.org") { console.error("::error::Commercial packages must not use public npm"); process.exit(1); }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Pro prerelease state
        run: |
          test -f .changeset/pre.json || { echo '::error::Pro develop is not in pre mode'; exit 1; }
          test "$(node -p "require('./.changeset/pre.json').mode")" = pre || { echo '::error::Pro develop has an invalid pre mode'; exit 1; }

      - name: Freeze the promoted OSS v3-main snapshot and install
        id: oss
        env:
          OSS_SHA: ${{ inputs.oss_sha }}
        run: |
          ARGS=(--branch main)
          if [ -n "$OSS_SHA" ]; then ARGS+=(--sha "$OSS_SHA"); fi
          node ./scripts/sync-release-oss.mjs "${ARGS[@]}"

      - name: Promote Pro versions
        id: promotion
        run: |
          git config user.name 'nocobase[bot]'
          git config user.email '179432756+nocobase[bot]@users.noreply.github.com'
          node ./vendor/nocobase3/scripts/list-package-versions.mjs > "$RUNNER_TEMP/pro-versions-before.json"
          NAME="chore/promote-${GITHUB_RUN_ID}"
          git checkout -b "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          pnpm changeset pre exit
          pnpm changeset version
          CHANGED=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --changed "$RUNNER_TEMP/pro-versions-before.json")
          test -n "$CHANGED" || { echo '::error::Pro promotion changed no versions'; exit 1; }
          test ! -f .changeset/pre.json || { echo '::error::Pro pre.json remains after promotion'; exit 1; }
          LEFT=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --prerelease)
          test -z "$LEFT" || { echo "::error::Pro promotion left prerelease versions: $LEFT"; exit 1; }
          echo "rows=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-rows "$RUNNER_TEMP/pro-versions-before.json")" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m 'chore: promote prerelease versions [skip ci]'

      # Make main an ancestor of the promotion branch before opening the PR. This preserves stable-only fixes and
      # resolves the gitlink explicitly instead of leaving GitHub's merge machinery to choose a submodule side.
      - name: Integrate current Pro main into the promotion candidate
        env:
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          CANDIDATE_SHA=$(git rev-parse HEAD)
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" != 0 ] && ! git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            echo '::error::Pro main could not be merged into the promotion candidate'
            exit 1
          fi
          node "$RUNNER_TEMP/reconcile-pro-release-metadata.mjs" \
            --metadata-source "$CANDIDATE_SHA" --oss-sha "$OSS_SHA"
          git rm -f --ignore-unmatch .changeset/pre.json
          if [ "$MERGE_RC" != 0 ]; then node ./vendor/nocobase3/scripts/resolve-sync-conflicts.mjs; fi
          test -z "$(git diff --name-only --diff-filter=U)" || { echo '::error::Unresolved Pro main integration conflicts remain'; exit 1; }
          CI=true pnpm install --no-frozen-lockfile
          git add -A
          if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            git commit -m 'chore: integrate stable-line changes into the promotion [skip ci]'
          elif ! git diff --cached --quiet; then
            git commit -m 'chore: align the promotion with the stable OSS snapshot [skip ci]'
          fi
          test ! -f .changeset/pre.json
          LEFT=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --prerelease)
          test -z "$LEFT" || { echo "::error::Integrated promotion contains prerelease versions: $LEFT"; exit 1; }

      - name: Build and test Pro
        run: |
          pnpm build
          pnpm test

      - name: Verify Pro packages in OSS Default
        uses: ./.github/actions/verify-create-app

      - name: Stop after validation
        if: inputs.dry_run
        run: echo 'dry_run=true — no Pro branch or PR was written.'

      - name: Create a fresh Pro write token
        if: '!inputs.dry_run'
        id: write_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Push the tested promotion branch
        if: '!inputs.dry_run'
        env:
          PRO_TOKEN: ${{ steps.write_token.outputs.token }}
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"
          git add -A
          test "$(git -C vendor/nocobase3 rev-parse HEAD)" = "$OSS_SHA"
          test "$(git ls-files --stage vendor/nocobase3 | awk '{print $2}')" = "$OSS_SHA"
          git diff --cached --quiet
          git push --force origin "${{ steps.promotion.outputs.name }}"

      - name: Merge the promotion into Pro main
        if: '!inputs.dry_run'
        id: merge_main
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
        run: |
          PR_URL=$(gh pr create --repo nocobase/nocobase3-pro \
            --title 'chore: promote prerelease versions' \
            --body "Promote Pro packages to stable versions and pin vendor/nocobase3 to OSS \`${{ steps.oss.outputs.sha }}\`. Packages are not published by this workflow." \
            --base main --head "${{ steps.promotion.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge --repo nocobase/nocobase3-pro "$PR_URL" --merge
          git fetch origin main
          test "$(git rev-parse origin/main:vendor/nocobase3)" = "${{ steps.oss.outputs.sha }}"

      - name: Merge promoted versions back into Pro develop
        if: "!inputs.dry_run && steps.merge_main.outcome == 'success'"
        id: merge_develop
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
        run: |
          git fetch origin develop
          DEVELOP_BASE=$(git rev-parse origin/develop)
          DEVELOP_OSS_SHA=$(git rev-parse origin/develop:vendor/nocobase3)
          SYNC="chore/sync-promoted-${GITHUB_RUN_ID}"
          git checkout -B "$SYNC" origin/develop
          set +e
          git merge --no-ff --no-commit "origin/${{ steps.promotion.outputs.name }}"
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" != 0 ] && ! git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            echo '::error::The promoted branch could not be merged into current Pro develop'
            exit 1
          fi
          node "$RUNNER_TEMP/reconcile-pro-release-metadata.mjs" \
            --metadata-source "$DEVELOP_BASE" --oss-sha "$DEVELOP_OSS_SHA"
          if git ls-files -u -- .changeset/pre.json | grep -q .; then
            git checkout --ours -- .changeset/pre.json
            git add .changeset/pre.json
          fi
          if [ "$MERGE_RC" != 0 ]; then node ./vendor/nocobase3/scripts/resolve-sync-conflicts.mjs; fi
          test -z "$(git diff --name-only --diff-filter=U)" || { echo '::error::Unresolved Pro develop sync conflicts remain'; exit 1; }
          if [ ! -f .changeset/pre.json ]; then pnpm changeset pre enter beta; fi
          CI=true pnpm install --no-frozen-lockfile
          git add -A
          git commit -m 'chore: sync promoted versions back to develop [skip ci]'
          git push --force origin "$SYNC"
          PR_URL=$(gh pr create --repo nocobase/nocobase3-pro \
            --title 'chore: sync promoted versions back to develop' \
            --body "Sync stable versions back to develop, re-enter prerelease mode, and restore the OSS v3-develop commit \`$DEVELOP_OSS_SHA\`." \
            --base develop --head "$SYNC")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge --repo nocobase/nocobase3-pro "$PR_URL" --merge --delete-branch

      - name: Notify success
        if: '!inputs.dry_run && success()'
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          REGISTRY_URL: ${{ secrets.PRO_NPM_REGISTRY }}
          TITLE: NocoBase 3 Pro develop 已合入 main
          STATUS: success
          STATUS_TEXT_SUCCESS: 待发布
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TABLE_JSON: ${{ steps.promotion.outputs.rows }}
          CONTENT: Pro 已转为稳定版本并合入 `main`，`develop` 已重新进入 pre 模式；尚未发布 npm。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh

      - name: Notify failure
        if: failure() && !inputs.dry_run
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          TITLE: NocoBase 3 Pro 转正流程失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: 请检查 OSS 仓库中的 Pro 转正运行及已创建的 Pro PR；本流程未发布 npm。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh
