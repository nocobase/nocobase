name: V3 Changeset Check

# Validate changeset syntax and require coverage for files that enter published packages.
# The release:skip label records intentional exceptions. Prerelease state is expected on
# v3-develop; v3-guard-main.yml rejects it only on pull requests targeting v3-main.

on:
  pull_request:
    branches:
      - v3-main
      - v3-develop
      - '*/v3-*'
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Validate and require changesets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changeset files
        shell: bash
        run: node scripts/validate-changesets.mjs

      - name: Require a changeset for every changed package
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release:skip') }}
        run: node scripts/require-changesets.mjs
