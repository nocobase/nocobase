# This default-branch entry dispatches the v1/v2 implementation on main so that it stays runnable from the default branch.
# To run it on another branch (next, develop, v1 or a feature branch), select that branch in "Use workflow from": GitHub then runs that branch's own rebuild-docker-nodefix.yml directly.
# Keep the name and the workflow_dispatch inputs in sync with rebuild-docker-nodefix.yml on main; see .github/V3-MIGRATION.md.
name: Rebuild Docker image with patched Node
on:
  workflow_dispatch:
    inputs:
      nocobase_version:
        description: NocoBase version, e.g. 2.2.26 (requires v<version> tag; overwrites matching image tags)
        required: true
        type: string
      node_version:
        description: Node.js major (e.g. 22 = latest 22.x) or exact version (e.g. 22.23.4)
        required: true
        default: '22'
        type: string
      variant:
        description: Docker image variant (all = build all four variants)
        required: true
        default: full
        type: choice
        options:
          - all
          - full
          - full-no-nginx
          - default
          - no-nginx
      tag_mode:
        description: Image tag mode
        required: true
        default: same-version
        type: choice
        options:
          - same-version
      platforms:
        description: Build platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string
      push_image:
        description: Push the built image to the registry
        required: true
        default: true
        type: boolean
      push_aliyun:
        description: Also push to Aliyun Container Registry
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    name: Run the v1/v2 implementation
    if: ${{ github.ref == 'refs/heads/v3-develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: rebuild-docker-nodefix.yml
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: >
          printf '%s' "$DISPATCH_INPUTS" \
            | jq '{ref: "main", inputs: ((. // {}) | with_entries(.value |= tostring))}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" --input -
          echo "Dispatched $WORKFLOW_FILE on main. Check that workflow run for its result." >>
          "$GITHUB_STEP_SUMMARY"
