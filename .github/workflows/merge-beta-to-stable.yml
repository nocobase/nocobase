name: V3 Merge Beta to Stable

# Promote v3-develop versions on a temporary branch, merge into v3-main, then sync
# back to v3-develop and re-enter prerelease mode. This does not publish to npm.
# Run release-stable.yml separately; publication checks package versions against
# the registry, so it does not depend on pending changesets still being present.
#
# The NocoBase App owns pushes and PR merges. App writes can trigger workflows, so every generated candidate,
# sync commit, and final PR merge subject carries [skip ci]. This workflow still runs its own validation.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute versions and run checks without pushing any branch'
        type: boolean
        default: false

concurrency:
  group: release-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    name: Promote beta and merge into v3-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out v3-develop
        uses: actions/checkout@v4
        with:
          ref: v3-develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Missing pre mode indicates an unfinished promotion or manually changed state.
      - name: Verify v3-develop is in pre mode
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::v3-develop is not in pre mode — there is no prerelease to promote"
            exit 1
          fi
          MODE=$(node -p "require('./.changeset/pre.json').mode")
          if [ "$MODE" != "pre" ]; then
            echo "::error::pre.json has mode '$MODE', expected 'pre'"
            exit 1
          fi
          echo "pre tag: $(node -p "require('./.changeset/pre.json').tag")"

      - name: Configure git
        run: |
          git config user.name "nocobase[bot]"
          git config user.email "179432756+nocobase[bot]@users.noreply.github.com"

      - name: Snapshot versions before promotion
        run: |
          node scripts/list-package-versions.mjs > /tmp/versions-before.json

      # Promotion changes versions without publishing. Reserve release/* tags for
      # the eventual publication, whose date may differ from the promotion date.
      - name: Create promotion branch
        id: branch
        run: |
          NAME="chore/promote-$(date -u +%Y-%m-%d)"
          git checkout -b "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Promotion branch: $NAME"

      # pre exit changes mode; version removes suffixes and pre.json.
      - name: Exit pre mode and version
        run: |
          pnpm changeset pre exit
          pnpm changeset version

      # A cycle with no published beta can exit successfully without changing versions.
      - name: Verify promotion actually changed versions
        id: changed
        run: |
          CHANGED=$(node scripts/list-package-versions.mjs --changed /tmp/versions-before.json)
          if [ -z "$CHANGED" ]; then
            echo "::error::Promotion changed no versions — this pre cycle may never have shipped a prerelease"
            exit 1
          fi
          echo "$CHANGED"

          # The notification table consumes a single-line JSON list.
          echo "rows=$(node scripts/list-package-versions.mjs --released-rows /tmp/versions-before.json)" >> "$GITHUB_OUTPUT"

      # Prerelease versions and state must not enter the stable branch.
      - name: Verify no prerelease residue
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::pre.json still exists — changeset version did not clean it up as expected"
            exit 1
          fi
          LEFT=$(node scripts/list-package-versions.mjs --prerelease)
          if [ -n "$LEFT" ]; then
            echo "::error::These packages are still on prerelease versions: $LEFT"
            exit 1
          fi

      - name: Summarize
        run: |
          {
            echo "### Pending release"
            echo
            echo "Run \`release-stable.yml\` after this is merged to publish:"
            echo
            echo "| Package | Version |"
            echo "| --- | --- |"
            node scripts/list-package-versions.mjs --table
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and test
        run: |
          pnpm build
          pnpm -r --if-present test

      - name: Stop here on dry run
        if: inputs.dry_run
        run: echo "dry_run=true — stopping here. The release branch was not pushed."

      - name: Create a fresh NocoBase release token
        if: '!inputs.dry_run'
        id: release_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Authenticate git writes as nocobase bot
        if: '!inputs.dry_run'
        env:
          RELEASE_TOKEN: ${{ steps.release_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/nocobase/nocobase.git"

      # Only update the workflow-owned temporary branch. A same-day retry replaces
      # its previous incomplete candidate; no release tag is created here.
      - name: Commit and push the promotion branch
        if: '!inputs.dry_run'
        run: |
          NAME="${{ steps.branch.outputs.name }}"
          git add -A
          git commit -m "chore: promote prerelease versions [skip ci]"
          git push --force origin "$NAME"

      - name: Merge into v3-main
        if: '!inputs.dry_run'
        id: merge_main
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: promote prerelease versions [skip ci]" \
            --body "Promoted the prerelease: version numbers no longer carry the \`-beta\` suffix. **Not published to npm yet** — run \`release-stable.yml\` after merging, which is what tags the release and creates its GitHub Release. Per-package versions are in the workflow summary." \
            --base v3-main \
            --head "${{ steps.branch.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          set +e
          gh pr merge "$PR_URL" --merge --subject "chore: merge promoted versions into v3-main [skip ci]"
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::warning::Failed to merge the PR into v3-main: $PR_URL"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      # Merge before re-entering pre mode so the merge cannot remove the new pre.json.
      - name: Merge back into v3-develop and re-enter pre mode
        if: "!inputs.dry_run && steps.merge_main.outputs.merged == 'true'"
        id: merge_develop
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          git fetch origin v3-develop
          SYNC="chore/sync-$(date -u +%Y-%m-%d)"
          git checkout -B "$SYNC" origin/v3-develop

          set +e
          git merge --no-ff "origin/${{ steps.branch.outputs.name }}" -m "chore: sync promoted versions back to v3-develop [skip ci]"
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::warning::Merging back into v3-develop hit conflicts that need manual work"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm changeset pre enter beta
          git add .changeset
          git commit -m "chore: re-enter pre mode for the next line [skip ci]"
          git push --force origin "$SYNC"

          PR_URL=$(gh pr create \
            --title "chore: sync promoted versions back to v3-develop [skip ci]" \
            --body "Sync the promoted versions back to v3-develop and re-enter pre mode." \
            --base v3-develop \
            --head "$SYNC")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          set +e
          gh pr merge "$PR_URL" --merge --delete-branch --subject "chore: merge promoted versions back into v3-develop [skip ci]"
          RC2=$?
          set -e
          if [ $RC2 -ne 0 ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify v3-main merge failure
        if: "!inputs.dry_run && steps.merge_main.outputs.merged == 'false'"
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 v3-develop 合入 v3-main 失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            `v3-develop` 合入 `v3-main` 时发生冲突：
            ${{ steps.merge_main.outputs.url }}

            npm 尚未发布，没有产生不一致状态。
            分支 `${{ steps.branch.outputs.name }}` 已保留。

            **注意**：`v3-develop` 仍处于已退出 pre 模式的状态，解决后需要
            合回 v3-develop 并执行 `changeset pre enter beta`。
        run: ./scripts/feishu-notify.sh

      - name: Notify v3-develop merge failure
        if: "!inputs.dry_run && steps.merge_main.outputs.merged == 'true' && steps.merge_develop.outputs.merged != 'true'"
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 已合入 v3-main，但同步回 v3-develop 失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            `v3-develop` 已合入 `v3-main`，可以发布了。

            但同步回 `v3-develop` 失败，需要人工处理：
            ${{ steps.merge_develop.outputs.url || '（合并阶段就失败了，没有创建 PR）' }}

            **v3-develop 目前不在 pre 模式**，处理完后需要执行：
            `pnpm changeset pre enter beta` 并提交。
        run: ./scripts/feishu-notify.sh

      - name: Fail the run when any merge failed
        if: "!inputs.dry_run && (steps.merge_main.outputs.merged == 'false' || steps.merge_develop.outputs.merged != 'true')"
        run: exit 1

      - name: Notify success
        if: "!inputs.dry_run && steps.merge_main.outputs.merged == 'true' && steps.merge_develop.outputs.merged == 'true'"
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_URL: https://npm.nocobase.ai
          TITLE: NocoBase 3 v3-develop 已合入 v3-main
          STATUS: success
          STATUS_TEXT_SUCCESS: 待发布
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TABLE_JSON: ${{ steps.changed.outputs.rows }}
          CONTENT: |
            `v3-develop` 已合入 `v3-main`，版本号不再带 `-beta` 后缀，`v3-develop` 已重新进入 pre 模式。

            **尚未发布到 npm。** 点 `release-stable.yml` 完成发布（输入保持默认）。

            待发布的 package：
        run: ./scripts/feishu-notify.sh

      # Cover failures before the merge steps, excluding merge failures already notified.
      - name: Notify failure
        if: >-
          failure() && !inputs.dry_run
          && steps.merge_main.outputs.merged != 'false'
          && steps.merge_develop.outputs.merged != 'false'
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TITLE: NocoBase 3 转正流程失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 流程中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            `v3-develop` 合入 `v3-main` 的流程中断，没有发布到 npm。

            失败发生在合并之前，分支状态没有变化，修好之后重新触发即可。
        run: ./scripts/feishu-notify.sh
