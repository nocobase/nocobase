name: V3 Release Pro Beta

# Run the commercial beta release on public-repository Actions minutes while every branch, tag, PR, and GitHub
# Release remains in nocobase/nocobase3-pro. Commercial source and packages never leave this job as artifacts.

on:
  workflow_dispatch:
    inputs:
      oss_sha:
        description: 'Exact OSS develop commit to pin (empty selects develop once at job start)'
        type: string
        required: false
      dry_run:
        description: 'Build and test without publishing or writing to the Pro repository'
        type: boolean
        default: false
  workflow_call:
    inputs:
      oss_sha:
        description: 'Exact OSS develop release commit'
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    secrets:
      NOCOBASE_APP_PRIVATE_KEY:
        required: true
      PRO_NPM_REGISTRY:
        required: true
      PRO_NPM_TOKEN:
        required: true
      RELEASE_RESULT_FEISHU_WEBHOOK_URL:
        required: false

concurrency:
  group: pro-release-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Pro beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Check out Pro develop
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: develop
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Configure the Pro read remote
        env:
          PRO_TOKEN: ${{ steps.checkout_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Validate the Pro npm registry
        env:
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node -e '
            const value = process.env.PRO_NPM_REGISTRY?.trim();
            if (!value) { console.error("::error::PRO_NPM_REGISTRY is not configured"); process.exit(1); }
            let registry;
            try { registry = new URL(value); } catch { console.error("::error::PRO_NPM_REGISTRY is not a valid URL"); process.exit(1); }
            if (registry.hostname === "registry.npmjs.org") { console.error("::error::Commercial packages must not use public npm"); process.exit(1); }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ secrets.PRO_NPM_REGISTRY }}
          scope: '@nocobase'

      - name: Inspect prerelease state
        id: release_state
        run: |
          test -f .changeset/pre.json || { echo '::error::Pro develop is not in pre mode'; exit 1; }
          test "$(node -p "require('./.changeset/pre.json').mode")" = pre || { echo '::error::Pro develop has an invalid pre mode'; exit 1; }
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$COUNT" = 0 ]; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo '### Pro beta release skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Pro develop has no pending changesets, so no package, tag, branch, PR, or Release was created.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze the OSS v3-develop snapshot and install
        if: steps.release_state.outputs.release == 'true'
        id: oss
        env:
          OSS_SHA: ${{ inputs.oss_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
        run: |
          ARGS=(--branch develop)
          if [ -n "$OSS_SHA" ]; then ARGS+=(--sha "$OSS_SHA"); fi
          node ./scripts/sync-release-oss.mjs "${ARGS[@]}"

      - name: Configure release branch
        if: steps.release_state.outputs.release == 'true'
        id: branch
        run: |
          git config user.name 'nocobase[bot]'
          git config user.email '179432756+nocobase[bot]@users.noreply.github.com'
          node ./vendor/nocobase3/scripts/list-package-versions.mjs > "$RUNNER_TEMP/pro-versions-before.json"
          git fetch origin --tags --force
          DAY=$(date -u +%Y-%m-%d)
          MAX=0
          for TAG in $(git tag -l "release-beta/${DAY}.*"); do
            NUMBER="${TAG##*.}"
            case "$NUMBER" in ''|*[!0-9]*) continue ;; esac
            [ "$NUMBER" -gt "$MAX" ] && MAX="$NUMBER"
          done
          BATCH="${DAY}.$((MAX + 1))"
          NAME="release-beta/$BATCH"
          git checkout -b "$NAME"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Version Pro packages
        if: steps.release_state.outputs.release == 'true'
        id: changed
        run: |
          pnpm changeset version
          CHANGED=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --changed "$RUNNER_TEMP/pro-versions-before.json")
          test -n "$CHANGED" || { echo '::error::Pro changesets changed no package versions'; exit 1; }
          echo "$CHANGED"
          echo "rows=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-rows "$RUNNER_TEMP/pro-versions-before.json")" >> "$GITHUB_OUTPUT"

      - name: Build and test Pro
        if: steps.release_state.outputs.release == 'true'
        run: |
          pnpm build
          pnpm test

      - name: Verify Pro packages in OSS Default
        if: steps.release_state.outputs.release == 'true'
        uses: ./.github/actions/verify-create-app

      - name: Stop after validation
        if: inputs.dry_run && steps.release_state.outputs.release == 'true'
        run: echo 'dry_run=true — no branch, tag, package, PR, or GitHub Release was written.'

      # Installation tokens expire after one hour, so mint the write token only after the long validation phase.
      - name: Create a fresh Pro write token
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true'"
        id: write_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: write
          permission-pull-requests: write

      - name: Commit, tag, and push the tested candidate
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true'"
        env:
          PRO_TOKEN: ${{ steps.write_token.outputs.token }}
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"
          git add -A
          test "$(git -C vendor/nocobase3 rev-parse HEAD)" = "$OSS_SHA"
          test "$(git ls-files --stage vendor/nocobase3 | awk '{print $2}')" = "$OSS_SHA"
          git commit -m "chore: release ${{ steps.branch.outputs.batch }} [skip ci]"
          git tag "${{ steps.branch.outputs.name }}"
          git push origin "refs/heads/${{ steps.branch.outputs.name }}:refs/heads/${{ steps.branch.outputs.name }}"
          git push origin "refs/tags/${{ steps.branch.outputs.name }}:refs/tags/${{ steps.branch.outputs.name }}"

      - name: Publish Pro packages
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: node ./scripts/publish-commercial-packages.mjs --registry "$PRO_NPM_REGISTRY" --tag beta

      - name: Point beta at this release and push package tags
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-specs "$RUNNER_TEMP/pro-versions-before.json" > "$RUNNER_TEMP/pro-released-specs.txt"
          FAILED=0
          while IFS= read -r SPEC; do
            [ -n "$SPEC" ] || continue
            npm dist-tag add "$SPEC" beta --registry "$PRO_NPM_REGISTRY" || FAILED=1
          done < "$RUNNER_TEMP/pro-released-specs.txt"
          test "$FAILED" = 0 || { echo '::error::One or more Pro beta dist-tags could not be updated'; exit 1; }
          git push origin --tags

      - name: Merge release metadata back into Pro develop
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true'"
        id: merge
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
        run: |
          PR_URL=$(gh pr create --repo nocobase/nocobase3-pro \
            --title "chore: release ${{ steps.branch.outputs.batch }}" \
            --body "Prerelease \`${{ steps.branch.outputs.batch }}\` published under \`beta\` using OSS commit \`${{ steps.oss.outputs.sha }}\`." \
            --base develop --head "${{ steps.branch.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge --repo nocobase/nocobase3-pro "$PR_URL" --merge --delete-branch

      - name: Create the Pro GitHub Release
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true' && steps.merge.outcome == 'success'"
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          TAG: ${{ steps.branch.outputs.name }}
        run: |
          node ./vendor/nocobase3/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/pro-release-notes.raw.md"
          sed -e 's#https://github.com/nocobase/nocobase3/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' \
              -e 's#https://github.com/nocobase/nocobase/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' "$RUNNER_TEMP/pro-release-notes.raw.md" > "$RUNNER_TEMP/pro-release-notes.md"
          TITLE="${TAG##*/}"
          if gh release view --repo nocobase/nocobase3-pro "$TAG" > /dev/null 2>&1; then
            gh release edit --repo nocobase/nocobase3-pro "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" --prerelease --latest=false
          else
            gh release create --repo nocobase/nocobase3-pro "$TAG" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" --prerelease --latest=false
          fi

      - name: Notify success
        if: "!inputs.dry_run && steps.release_state.outputs.release == 'true' && success()"
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          REGISTRY_URL: ${{ secrets.PRO_NPM_REGISTRY }}
          TITLE: NocoBase 3 Pro 预览版发布
          STATUS: success
          STATUS_TEXT_SUCCESS: 发布成功
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/nocobase/nocobase3-pro/releases
          TABLE_JSON: ${{ steps.changed.outputs.rows }}
          CONTENT: 版本 **${{ steps.branch.outputs.batch }}** 已发布到私有 npm（dist-tag `beta`）。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh

      - name: Notify failure
        if: failure() && !inputs.dry_run
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          TITLE: NocoBase 3 Pro 预览版发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发版中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: 请检查 OSS 仓库中的 Pro 发版运行；若 publish 已执行，重跑前先确认私有 registry 状态。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh
