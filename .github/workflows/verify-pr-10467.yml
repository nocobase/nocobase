name: Verify PR 10467 variables
on:
  push:
    branches: [verify/pr-10467-template-variables]
permissions:
  contents: write
concurrency:
  group: verify-pr-10467-variables
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOGGER_LEVEL: error
      DB_DIALECT: sqlite
      DB_STORAGE: /tmp/pr10467-review.sqlite
      DB_TEST_PREFIX: test_
      ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J]
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore PR source
        run: git restore --source=6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3 --staged --worktree packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: pr10467-node22-sqlite5-v1-${{ hashFiles('yarn.lock') }}
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 > /tmp/pr10467-review-install.log 2>&1
          yarn add sqlite3@5.1.7 prettier@3.6.2 --no-save -W --network-timeout 600000 >> /tmp/pr10467-review-install.log 2>&1
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Prepare workspace aliases
        run: yarn postinstall
      - name: Add regression test
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          patch = ''
          Path('/tmp/pr10467-review.patch').write_bytes(zlib.decompress(base64.b64decode(patch)))
          PY
          git apply --include='packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts' /tmp/pr10467-review.patch
      - name: Confirm regression fails before fix
        run: |
          status=0
          yarn test packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts --server --run -t 'retains runtime variables when a reference event' --reporter=json --outputFile=/tmp/pr10467-review-before.json > /tmp/pr10467-review-before.log 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pr10467-review-before.json'))
          failed=[a for r in d['testResults'] for a in r['assertionResults'] if a['status']=='failed']
          assert len(failed)==1 and 'retains runtime variables' in failed[0]['fullName'], failed
          assert 'expected false to be true' in '\n'.join(failed[0]['failureMessages'])
          print('Confirmed the target-variable regression on PR head.')
          PY
      - name: Apply compatibility fix and lint
        run: |
          git apply --include='packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts' /tmp/pr10467-review.patch
          yarn eslint --fix --max-warnings=0 packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts
          git diff --check
      - name: All variable server tests
        run: |
          cat > vitest.pr10467.config.mjs <<'JS'
          import { defineConfig } from './packages/core/test/vitest.mjs';
          const config = defineConfig();
          config.test.include = ['packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables*.test.ts'];
          export default config;
          JS
          yarn test --server --run --config=vitest.pr10467.config.mjs --reporter=default --reporter=json --outputFile=/tmp/pr10467-review-server.json > /tmp/pr10467-review-server.log 2>&1
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pr10467-review-server.json'))
          assert d['success'] and d['numFailedTests']==0
          assert len(d['testResults'])==19, len(d['testResults'])
          print('Verified',len(d['testResults']),'files and',d['numPassedTests'],'tests.')
          PY
      - name: Create tested review commit
        run: |
          base=6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3
          git read-tree "$base"
          git add packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: preserve target variables in reference events' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/verify/pr-10467-reviewed-${{ github.run_number }}"
          printf '%s\n' "$commit" > /tmp/pr10467-reviewed-commit.txt
          git diff --stat "$base" "$commit" >> /tmp/pr10467-reviewed-commit.txt
          git diff "$base" "$commit" -- packages > /tmp/pr10467-reviewed.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-review-results
          path: |
            /tmp/pr10467-review-*.json
            /tmp/pr10467-review-*.log
            /tmp/pr10467-reviewed-commit.txt
            /tmp/pr10467-reviewed.patch
          retention-days: 7
