name: Verify PR 10467 variables
on:
  push:
    branches: [verify/pr-10467-template-variables]
permissions:
  contents: write
concurrency:
  group: verify-pr-10467-variables
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOGGER_LEVEL: error
      DB_DIALECT: sqlite
      DB_STORAGE: /tmp/pr10467.sqlite
      DB_TEST_PREFIX: test_
      ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J]
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: pr10467-node22-sqlite5-v1-${{ hashFiles('yarn.lock') }}
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Install dependencies
        id: dependencies
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 > /tmp/pr10467-install.log 2>&1 || { tail -100 /tmp/pr10467-install.log; exit 1; }
          yarn add sqlite3@5.1.7 prettier@3.6.2 --no-save -W --network-timeout 600000 >> /tmp/pr10467-install.log 2>&1 || { tail -100 /tmp/pr10467-install.log; exit 1; }
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Apply regression patch
        id: patch
        run: python3 .github/pr10467/apply.py
      - name: Lint changed source
        run: |
          xargs -d '\n' yarn eslint --fix --max-warnings=0 < /tmp/pr10467-files.txt
          git diff --check
      - name: Server variable regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test 'packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables*.test.ts' --run --reporter=default --reporter=json --outputFile=/tmp/pr10467-server.json
      - name: Core flow engine regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/core/flow-engine/src --run --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=/tmp/pr10467-core.json
      - name: Template client regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/plugins/@nocobase/plugin-ui-templates/src/client-v2 --run --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=/tmp/pr10467-templates.json
      - name: Publish tested commit to verification branch
        run: |
          git read-tree b05578ebec32a3493ef13149859c1ac890c3705a
          while IFS= read -r file; do git add -- "$file"; done < /tmp/pr10467-files.txt
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: resolve variables in referenced templates and scripts' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p b05578ebec32a3493ef13149859c1ac890c3705a)
          git push origin "$commit:refs/heads/verify/pr-10467-tested"
          echo "Tested commit: $commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Save patch
        if: always()
        run: git diff b05578ebec32a3493ef13149859c1ac890c3705a -- packages > /tmp/pr10467.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-verification
          path: |
            /tmp/pr10467.patch
            /tmp/pr10467-*.json
            /tmp/pr10467-install.log
          retention-days: 7
