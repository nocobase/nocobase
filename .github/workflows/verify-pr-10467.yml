name: Verify PR 10467 variables
on:
  push:
    branches: [verify/pr-10467-template-variables]
permissions:
  contents: write
concurrency:
  group: verify-pr-10467-variables
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOGGER_LEVEL: error
      DB_DIALECT: sqlite
      DB_STORAGE: /tmp/pr10467.sqlite
      DB_TEST_PREFIX: test_
      ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J]
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: pr10467-node22-sqlite5-v1-${{ hashFiles('yarn.lock') }}
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 > /tmp/pr10467-install.log 2>&1
          yarn add sqlite3@5.1.7 prettier@3.6.2 --no-save -W --network-timeout 600000 >> /tmp/pr10467-install.log 2>&1
      - name: Prepare workspace aliases
        run: yarn postinstall
      - name: Apply regression patch
        id: patch
        run: python3 .github/pr10467/apply.py
      - name: Lint changed source
        id: lint
        continue-on-error: true
        run: |
          xargs -d '\n' yarn eslint --fix --format=json --output-file=/tmp/pr10467-lint.json < /tmp/pr10467-files.txt
          git diff --check
      - name: Create clean PR candidate
        id: candidate
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          base=b05578ebec32a3493ef13149859c1ac890c3705a
          git diff "$base" -- packages > /tmp/pr10467.patch
          git read-tree "$base"
          while IFS= read -r file; do git add -- "$file"; done < /tmp/pr10467-files.txt
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: resolve variables in referenced templates and scripts' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/verify/pr-10467-candidate-${{ github.run_number }}"
          printf '%s\n' "$commit" > /tmp/pr10467-candidate.txt
          git diff --stat "$base" "$commit" >> /tmp/pr10467-candidate.txt
          cat /tmp/pr10467-candidate.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-preflight
          path: |
            /tmp/pr10467-lint.json
            /tmp/pr10467-candidate.txt
            /tmp/pr10467.patch
          retention-days: 7
      - name: Variable server regression suite
        id: server
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test 'packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables*.test.ts' --server --run --reporter=default --reporter=json --outputFile=/tmp/pr10467-server.json > /tmp/pr10467-server.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-server-results
          path: |
            /tmp/pr10467-server.json
            /tmp/pr10467-server.log
          retention-days: 7
      - name: Core flow engine regression suite
        id: core
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/core/flow-engine/src --client --run --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=/tmp/pr10467-core.json > /tmp/pr10467-core.log 2>&1
      - name: Template client regression suite
        id: templates
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/plugins/@nocobase/plugin-ui-templates/src/client-v2 --client --run --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=/tmp/pr10467-templates.json > /tmp/pr10467-templates.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-verification
          path: |
            /tmp/pr10467.patch
            /tmp/pr10467-*.json
            /tmp/pr10467-*.log
            /tmp/pr10467-candidate.txt
          retention-days: 7
      - name: Require successful checks
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          TEMPLATES_OUTCOME: ${{ steps.templates.outcome }}
        run: test "$LINT_OUTCOME/$SERVER_OUTCOME/$CORE_OUTCOME/$TEMPLATES_OUTCOME" = 'success/success/success/success'
