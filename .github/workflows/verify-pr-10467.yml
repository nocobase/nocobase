name: Verify PR 10467 variables
on:
  push:
    branches: [verify/pr-10467-template-variables]
permissions:
  contents: write
concurrency:
  group: verify-pr-10467-variables
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOGGER_LEVEL: error
      DB_DIALECT: sqlite
      DB_STORAGE: /tmp/pr10467.sqlite
      DB_TEST_PREFIX: test_
      ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J]
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - name: Restore PR source
        run: |
          git fetch --quiet --depth=1 origin 6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3
          git restore --source=6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3 --staged --worktree packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: pr10467-http-env-v1
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 > /tmp/pr10467-install.log 2>&1
          yarn add sqlite3@5.1.7 prettier@3.6.2 --no-save -W --network-timeout 600000 >> /tmp/pr10467-install.log 2>&1
      - run: yarn postinstall
      - name: Prepare reviewed changes
        id: patch
        run: |
          git apply .github/pr10467/followup.patch
          cp .github/pr10467/client.tsx packages/core/client-v2/src/flow/models/blocks/form/__tests__/popupLinkage.test.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/plugins/@nocobase/plugin-ui-layout/src/client-v2/__tests__/layoutPermissions.test.tsx')
          text = p.read_text()
          old = "    expect(adminRoute).toBeChecked();\n\n    await act(async () => {\n      await user.click(adminRoute);"
          new = "    expect(adminRoute).toBeChecked();\n    await waitFor(() => {\n      expect(adminRoute).not.toHaveStyle({ pointerEvents: 'none' });\n    });\n\n    await act(async () => {\n      await user.click(adminRoute);"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          files = [
            'packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts',
            'packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.resolve.form-linkage.test.ts',
            'packages/core/client-v2/src/flow/models/blocks/form/__tests__/popupLinkage.test.tsx',
            str(p),
          ]
          Path('/tmp/pr10467-files.txt').write_text('\n'.join(files) + '\n')
          PY
          xargs -d '\n' yarn eslint --fix --max-warnings=0 < /tmp/pr10467-files.txt > /tmp/pr10467-lint.log 2>&1
          git diff --check
      - name: Variable server regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          cat > vitest.pr10467.config.mjs <<'JS'
          import { defineConfig } from './packages/core/test/vitest.mjs';
          const config = defineConfig();
          config.test.include = ['packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables*.test.ts'];
          export default config;
          JS
          yarn test --server --run --config=vitest.pr10467.config.mjs --reporter=json --outputFile=/tmp/pr10467-server.json > /tmp/pr10467-server.log 2>&1
      - name: Core flow engine regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/core/flow-engine/src --client --run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile=/tmp/pr10467-core.json > /tmp/pr10467-core.log 2>&1
      - name: Template client regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/plugins/@nocobase/plugin-ui-templates/src/client-v2 --client --run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile=/tmp/pr10467-templates.json > /tmp/pr10467-templates.log 2>&1
      - name: Form runtime and popup regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/core/client-v2/src/flow/models/blocks/form --client --run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile=/tmp/pr10467-client.json > /tmp/pr10467-client.log 2>&1
      - name: UI layout client regression suite
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: yarn test packages/plugins/@nocobase/plugin-ui-layout/src/client-v2 --client --run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile=/tmp/pr10467-layout.json > /tmp/pr10467-layout.log 2>&1
      - name: Recheck permission loading three times
        run: |
          for attempt in 1 2 3; do
            yarn test packages/plugins/@nocobase/plugin-ui-layout/src/client-v2/__tests__/layoutPermissions.test.tsx --client --run --reporter=json --outputFile=/tmp/pr10467-layout-repeat-$attempt.json > /tmp/pr10467-layout-repeat-$attempt.log 2>&1
          done
      - name: Publish clean candidate for final review
        run: |
          base=6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3
          git read-tree "$base"
          while IFS= read -r file; do git add -- "$file"; done < /tmp/pr10467-files.txt
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: verify form variable resolution regressions' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/verify/pr-10467-final-${{ github.run_number }}"
          printf 'tree=%s\ncommit=%s\n' "$tree" "$commit" > /tmp/pr10467-candidate.txt
          git diff --stat "$base" "$commit" >> /tmp/pr10467-candidate.txt
          git diff "$base" "$commit" -- packages > /tmp/pr10467-final.patch
      - name: Export test summary and candidate files
        if: always()
        run: |
          mkdir -p /tmp/pr10467-files
          while IFS= read -r file; do cp --parents "$file" /tmp/pr10467-files; done < /tmp/pr10467-files.txt
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          lines=[]
          for name in ['server','core','templates','client','layout']:
              p=Path('/tmp/pr10467-' + name + '.json')
              if not p.exists():
                  lines.append(name + ': no result')
                  continue
              d=json.loads(p.read_text())
              tests=[t for s in d['testResults'] for t in s['assertionResults']]
              lines.append(f"{name}: success={d['success']} files={len(d['testResults'])} {dict(Counter(t['status'] for t in tests))}")
              for t in tests:
                  if t['status']=='failed': lines.append(t['fullName']+'\n'+'\n'.join(t['failureMessages']))
          Path('/tmp/pr10467-summary.txt').write_text('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-final-candidate
          path: |
            /tmp/pr10467-files
            /tmp/pr10467-candidate.txt
            /tmp/pr10467-final.patch
            /tmp/pr10467-summary.txt
            /tmp/pr10467-*.json
            /tmp/pr10467-*.log
          retention-days: 7
