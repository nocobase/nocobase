name: Verify PR 10467 variables
on:
  push:
    branches: [verify/pr-10467-template-variables]
permissions:
  contents: read
concurrency:
  group: verify-pr-10467-variables
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOGGER_LEVEL: error
      DB_DIALECT: sqlite
      DB_STORAGE: /tmp/pr10467.sqlite
      DB_TEST_PREFIX: test_
      ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J]
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore PR source
        run: git restore --source=6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3 --staged --worktree packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: pr10467-http-env-v1
          path: |
            node_modules
            packages/*/*/node_modules
            packages/plugins/@nocobase/*/node_modules
            /usr/local/share/.cache/yarn
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn add sqlite3@5.1.7 prettier@3.6.2 --no-save -W --network-timeout 600000
      - name: Prepare workspace aliases
        run: yarn postinstall
      - name: Client linkage regression
        run: |
          file=packages/core/client-v2/src/flow/models/blocks/form/__tests__/popupLinkage.test.tsx
          cp .github/pr10467/client.tsx "$file"
          yarn eslint --fix "$file" > /tmp/client-lint.log 2>&1
          yarn test "$file" --client --run --reporter=verbose --reporter=json --outputFile=/tmp/client.json > /tmp/client.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10467-client-results
          path: |
            /tmp/client*.json
            /tmp/client*.log
            packages/core/client-v2/src/flow/models/blocks/form/__tests__/popupLinkage.test.tsx
          retention-days: 7
