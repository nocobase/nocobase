name: V3 Studio Release
run-name: studio-release:${{ inputs.channel }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Release NocoBase Studio's image from the private nocobase/studio repository to the private registry
# pkg-v3.nocobase.com/nocobase/studio, for linux/amd64 and linux/arm64. The released version is the `version` of Studio's
# root package.json, as it is: unlike nocobase-ci's internal studio-image.yml, nothing is stamped with a dev version.
#
# - channel=beta releases studio's `dev` branch and channel=latest its `main` branch. The bump below goes back to the
#   same branch.
# - Before anything is built, the run stops when `nocobase/studio:<version>` already exists in the registry or studio
#   already has the git tag `v<version>`. The registry gates customers by the time a digest was first pushed, so pushing
#   a version again would move its tag to a new digest that customers whose updates expired could no longer pull.
# - Each platform builds its own dist/ and pushes its image by digest; one job then tags both under a multi-platform
#   manifest (see "Name the tags" for which tags), studio is tagged `v<version>` on the commit that was built, and the
#   versions of package.json and packages/studio-cli/package.json are bumped to the next version (1.0.0-beta.58 ->
#   1.0.0-beta.59, 1.0.0 -> 1.0.1) through a squashed pull request into the source branch.
# - Once the tag is pushed, Studio's own scripts/release/release-notes.mjs, taken from the released commit, writes the
#   English and Chinese release notes from the descriptions of the pull requests merged since the previous tag. They
#   become the GitHub release `v<version>` of nocobase/studio (a prerelease for beta; an existing release is left
#   alone), go into the job summary with the pull requests whose description the script could not read, and the
#   Chinese notes go into the success notice. The same script prepends the version to CHANGELOG.md and
#   CHANGELOG.zh-CN.md, which live on `dev` only: a beta release commits them in its bump pull request to `dev`; a
#   latest release keeps its bump pull request to `main` version-only and merges them into `dev` through a second
#   squashed pull request from `release/studio-<version>-changelog`. Notes, changelog and GitHub release are
#   best-effort: the image and the tag are already published by then, so a failure there (or a released commit older
#   than the script) warns and is reported in the summary and the notice, but never fails the run.
# - dry_run resolves, validates and builds both platforms, but never signs in to the registry for a push, pushes,
#   tags, pushes a branch, opens a pull request, creates a GitHub release or notifies. With DOCKER_PUBLISH_TOKEN
#   configured it also runs the read-only registry checks, so the tag decision can be previewed. It writes no release
#   notes: they are only ever generated by the release job, which a dry run skips.
#
# Secrets: DOCKER_PUBLISH_TOKEN (the registry's PUBLISH_TOKEN), NOCOBASE_APP_PRIVATE_KEY with vars.NOCOBASE_APP_ID (the
# NocoBase GitHub App, installed on nocobase/studio) and RELEASE_RESULT_FEISHU_WEBHOOK_URL.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta releases studio dev; latest releases studio main'
        type: choice
        options:
          - beta
          - latest
        default: beta
      dry_run:
        description: 'Dry run: resolve, validate and build without pushing, tagging or merging anything'
        type: boolean
        default: false

# One Studio release at a time, whatever the channel: the checks in prepare are only valid while no other run can push
# a version or move latest.
concurrency:
  group: studio-release
  cancel-in-progress: false

permissions:
  contents: read

# Image names only, never credentials, so they can travel through job outputs.
env:
  REGISTRY: pkg-v3.nocobase.com
  IMAGE_REPOSITORY: nocobase/studio
  # One line, at most 200 characters. Set on the index as org.opencontainers.image.description; the registry shows it
  # on the repository's card of its public image pages.
  IMAGE_DESCRIPTION: NocoBase Studio

jobs:
  prepare:
    name: Prepare the Studio release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      next_version: ${{ steps.version.outputs.next }}
      bump_branch: ${{ steps.version.outputs.bump_branch }}
      tags: ${{ steps.tags.outputs.tags }}
      latest_reason: ${{ steps.tags.outputs.latest_reason }}
    steps:
      # Without the publish token a real release could only fail at the push, after both builds. A dry run goes on and
      # skips the registry checks.
      - name: Check the registry publish token
        id: publish_token
        env:
          DOCKER_PUBLISH_TOKEN: ${{ secrets.DOCKER_PUBLISH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$DOCKER_PUBLISH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::The repository secret DOCKER_PUBLISH_TOKEN is not configured; this dry run skips the registry checks."
            exit 0
          fi
          echo "::error::The repository secret DOCKER_PUBLISH_TOKEN is not configured. Set it to the private registry's PUBLISH_TOKEN (Settings -> Secrets and variables -> Actions)."
          exit 1

      - name: Pick the source branch
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            beta) echo "branch=dev" >> "$GITHUB_OUTPUT" ;;
            latest) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown channel '$CHANNEL'"
              exit 1
              ;;
          esac

      # A read-only token for nocobase/studio alone, revoked as soon as the source is resolved.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read
          skip-token-revoke: true

      # Resolved once, so both platforms build, and the tag lands on, the same commit even if the branch moves during the
      # run. package.json is read at that commit, not at the branch.
      - name: Resolve the source
        id: source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          commit=$(gh api "repos/nocobase/studio/commits/${BRANCH}" --jq .sha)
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/nocobase/studio/contents/package.json?ref=${commit}" > "$RUNNER_TEMP/studio-package.json"
          {
            echo "branch=${BRANCH}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          echo "nocobase/studio ${BRANCH} is at ${commit}"

      # Semver with an optional prerelease part and no build metadata, which is not a valid image tag. The next version
      # is computed here too, so a version that cannot be bumped stops the run before anything is published: a
      # prerelease adds one to its last identifier, which must be numeric (1.0.0-beta.58 -> 1.0.0-beta.59), and a
      # release adds one to its patch (1.0.0 -> 1.0.1).
      - name: Read and validate the version
        id: version
        run: |
          version=$(jq -r '.version // empty' "$RUNNER_TEMP/studio-package.json")
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Studio's package.json has no valid semver version (found '${version}')."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            core=${version%%-*}
            pre=${version#*-}
            last=${pre##*.}
            if ! [[ "$last" =~ ^[0-9]+$ ]]; then
              echo "::error::Cannot compute the next version of ${version}: its prerelease part does not end in a number."
              exit 1
            fi
            if [[ "$pre" == *.* ]]; then
              next="${core}-${pre%.*}.$((10#$last + 1))"
            else
              next="${core}-$((10#$last + 1))"
            fi
          else
            IFS=. read -r major minor patch <<< "$version"
            next="${major}.${minor}.$((10#$patch + 1))"
          fi
          {
            echo "version=${version}"
            echo "next=${next}"
            echo "bump_branch=release/studio-${next}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}; the source branch moves on to ${next}."

      # matching-refs lists every ref with the prefix (v1.0.0 also matches v1.0.0-beta.1), so compare full names.
      - name: Check studio's tag and bump branch are free
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP_BRANCH: ${{ steps.version.outputs.bump_branch }}
        run: |
          if gh api "repos/nocobase/studio/git/matching-refs/tags/v${VERSION}" --jq '.[].ref' | grep -qxF "refs/tags/v${VERSION}"; then
            echo "::error::nocobase/studio already has the tag v${VERSION}: this version was released. Bump the version in Studio's package.json first."
            exit 1
          fi
          if gh api "repos/nocobase/studio/git/matching-refs/heads/${BUMP_BRANCH}" --jq '.[].ref' | grep -qxF "refs/heads/${BUMP_BRANCH}"; then
            echo "::error::nocobase/studio already has the branch ${BUMP_BRANCH}, left by an earlier release. Merge or delete it first."
            exit 1
          fi

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      # Read-only: a pull-scoped registry token, HEAD requests and tags/list. The tag decision:
      #
      # - The version itself, always. It must not exist yet (see the header).
      # - channel=latest: the version and `latest`, even when the version is a prerelease. `beta` is left alone.
      # - channel=beta: the version and `beta`, and `latest` only while latest has never been a release. latest moves to
      #   this beta when it does not exist or when it points to a prerelease (a version with a `-` part). Once a release
      #   without a prerelease part has taken latest, beta releases no longer touch it. latest's version is found by
      #   comparing its digest with the digest of every version tag; when no version tag has its digest, latest is left
      #   alone with a warning, since moving it could replace a release.
      - name: Check the registry and name the tags
        id: tags
        env:
          DOCKER_PUBLISH_TOKEN: ${{ secrets.DOCKER_PUBLISH_TOKEN }}
          HAS_TOKEN: ${{ steps.publish_token.outputs.configured }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "latest" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n%s\n' "$VERSION" latest
              echo "EOF"
              echo "latest_reason=channel=latest always moves latest"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Registry checks skipped: DOCKER_PUBLISH_TOKEN is not configured (dry run only)."
            if [ "$CHANNEL" = "beta" ]; then
              {
                echo "tags<<EOF"
                printf '%s\n%s\n' "$VERSION" beta
                echo "EOF"
                echo "latest_reason=unknown: the registry was not checked (dry run without DOCKER_PUBLISH_TOKEN)"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          base="https://${REGISTRY}/v2/${IMAGE_REPOSITORY}"
          jwt=$(curl --fail --silent --show-error --retry 3 --user "ci:${DOCKER_PUBLISH_TOKEN}" \
            "https://${REGISTRY}/-/docker/token?service=${REGISTRY}&scope=repository:${IMAGE_REPOSITORY}:pull" \
            | jq -r '.token // .access_token // empty')
          if [ -z "$jwt" ]; then
            echo "::error::The registry issued no token for DOCKER_PUBLISH_TOKEN."
            exit 1
          fi
          echo "::add-mask::${jwt}"
          # Accept every manifest type, or the registry answers 404 for a multi-platform index.
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          headers="$RUNNER_TEMP/registry-headers"
          body="$RUNNER_TEMP/registry-body"

          # Prints the digest a tag points to and returns 0, returns 1 when the tag does not exist, 2 on anything else.
          manifest_digest() {
            local code
            code=$(curl --silent --show-error --retry 3 --head --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${jwt}" --header "Accept: ${accept}" "${base}/manifests/$1") || code=000
            case "$code" in
              200) tr -d '\r' < "$headers" | awk 'tolower($1) == "docker-content-digest:" { print $2 }' ;;
              404) return 1 ;;
              *)
                echo "::error::HEAD ${IMAGE_REPOSITORY}:$1 answered HTTP ${code}." >&2
                return 2
                ;;
            esac
          }

          rc=0
          manifest_digest "$VERSION" > /dev/null || rc=$?
          case "$rc" in
            0)
              echo "::error::${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION} already exists. Pushing it again would move the tag to a new digest; bump the version in Studio's package.json first."
              exit 1
              ;;
            1) echo "${IMAGE_REPOSITORY}:${VERSION} does not exist yet." ;;
            *) exit 1 ;;
          esac

          [ "$CHANNEL" = "beta" ] || exit 0

          move_latest=false
          rc=0
          latest_digest=$(manifest_digest latest) || rc=$?
          if [ "$rc" = "1" ]; then
            move_latest=true
            reason="latest does not exist yet, so this beta takes it"
          elif [ "$rc" != "0" ] || [ -z "$latest_digest" ]; then
            echo "::error::Could not read the digest latest points to."
            exit 1
          else
            # All version tags, following the Link header if the registry pages them.
            : > "$RUNNER_TEMP/registry-tags"
            url="${base}/tags/list?n=1000"
            while [ -n "$url" ]; do
              code=$(curl --silent --show-error --retry 3 --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
                --header "Authorization: Bearer ${jwt}" "$url") || code=000
              if [ "$code" != "200" ]; then
                echo "::error::Listing the tags of ${IMAGE_REPOSITORY} answered HTTP ${code}."
                exit 1
              fi
              jq -r '.tags // [] | .[]' "$body" >> "$RUNNER_TEMP/registry-tags"
              next=$(tr -d '\r' < "$headers" | awk 'tolower($1) == "link:"' | sed -nE 's/.*<([^>]*)>.*/\1/p')
              url=${next:+https://${REGISTRY}${next}}
            done
            semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            # A tag that disappeared meanwhile is skipped; any other failure stops the run rather than guessing.
            matched=()
            while IFS= read -r tag; do
              [[ "$tag" =~ $semver ]] || continue
              rc=0
              digest=$(manifest_digest "$tag") || rc=$?
              case "$rc" in
                0) if [ "$digest" = "$latest_digest" ]; then matched+=("$tag"); fi ;;
                1) continue ;;
                *) exit 1 ;;
              esac
            done < "$RUNNER_TEMP/registry-tags"
            releases=()
            for tag in "${matched[@]}"; do
              [[ "$tag" == *-* ]] || releases+=("$tag")
            done
            if [ "${#matched[@]}" = "0" ]; then
              echo "::warning::latest (${latest_digest}) matches no version tag, so it is left alone."
              reason="latest matches no version tag; left alone to be safe"
            elif [ "${#releases[@]}" != "0" ]; then
              reason="latest is the release ${releases[*]}; beta releases no longer move it"
            else
              move_latest=true
              reason="latest is the prerelease ${matched[*]}, so this beta takes it"
            fi
          fi
          echo "$reason"
          {
            echo "tags<<EOF"
            printf '%s\n%s\n' "$VERSION" beta
            if [ "$move_latest" = "true" ]; then echo latest; fi
            echo "EOF"
            echo "latest_reason=${reason}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH: ${{ steps.source.outputs.branch }}
          COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
          NEXT: ${{ steps.version.outputs.next }}
          TAGS: ${{ steps.tags.outputs.tags }}
          LATEST_REASON: ${{ steps.tags.outputs.latest_reason }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo '### Studio release (dry run: nothing is pushed)'
            else
              echo '### Studio release'
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Source | \`nocobase/studio@${BRANCH}\` (\`${COMMIT}\`) |"
            echo "| Next version | \`${NEXT}\` |"
            echo "| latest | ${LATEST_REASON} |"
            echo
            echo 'Tags to push:'
            echo
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "- \`${REGISTRY}/${IMAGE_REPOSITORY}:${tag}\`"; fi
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Each platform builds its own dist/ and pushes its image by digest, in parallel; `manifest` then tags both as one.
  # Both run on x64: `pnpm build --target linux-arm64` fetches the arm64 native binaries rather than compiling under
  # emulation, and QEMU only runs the arm64 image's last few RUN lines. A dry run builds the image without pushing it.
  image:
    name: Build the linux/${{ matrix.arch }} image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            target: linux-x64
          - arch: arm64
            target: linux-arm64
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # A read-only token for nocobase/studio alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read
          skip-token-revoke: true

      # The framework is the public submodule vendor/nocobase3; only Studio itself needs the token.
      - name: Check out Studio
        uses: actions/checkout@v4
        with:
          repository: nocobase/studio
          ref: ${{ needs.prepare.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: true
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      # The image carries the version prepare validated; a mismatch means the checkout is not the commit prepare read.
      - name: Verify the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual=$(jq -r '.version' package.json)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json has version ${actual}, but prepare validated ${VERSION}."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist/ is built here, with this job's heap, and the image takes it prebuilt. Studio's build first builds the
      # workspace packages it depends on, and dist/ includes dist/runners, the nb-studio and nocobase-runner packages
      # Studio serves, at the released versions. `--target` swaps in the native binaries of the image's platform; the
      # Dockerfile refuses a dist/ built for another one.
      - name: Build dist
        run: pnpm build --target ${{ matrix.target }}

      - name: Sign in to the registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ci
          password: ${{ secrets.DOCKER_PUBLISH_TOKEN }}

      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushed by digest alone; the tags go on the multi-platform manifest. provenance and sbom stay off: their
      # attestation manifests would enter the registry's version index (and ACR-style registries reject them). A dry run
      # keeps the result in the build cache only.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: DIST=prebuilt
          outputs: ${{ inputs.dry_run && 'type=cacheonly' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_REPOSITORY) }}
          provenance: false
          sbom: false

      - name: Export the digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::The build reported no digest."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag the multi-platform image
    needs: [prepare, image]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ci
          password: ${{ secrets.DOCKER_PUBLISH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The version is the first tag, so it is the first to point at the index.
      - name: Tag and push the manifest
        id: push
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/${IMAGE_REPOSITORY}"
          count=$(find "$DIGESTS" -type f | wc -l | tr -d ' ')
          if [ "$count" != "2" ]; then
            echo "::error::Expected the digests of 2 platforms, found ${count}."
            exit 1
          fi
          args=(--annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}")
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "${image}:${tag}"); fi
          done <<< "$TAGS"
          for digest in "$DIGESTS"/*; do
            args+=("${image}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${image}:${VERSION}"
          echo "digest=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

  release:
    name: Tag studio and bump its version
    needs: [prepare, manifest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      merged: ${{ steps.merge.outputs.merged }}
      pr_url: ${{ steps.merge.outputs.url }}
    steps:
      # Minted after the image is pushed so long builds do not consume its one-hour lifetime.
      - name: Create a studio write token
        id: release_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: write
          permission-pull-requests: write

      # Without submodules: the bump changes two package.json files (and, for beta, the changelogs) and must leave
      # vendor/nocobase3 where it is. Full history and tags, because the release notes walk `git log <previous tag>..v<version>`
      # and find the previous tag among the tags merged into the released commit.
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          repository: nocobase/studio
          ref: ${{ needs.prepare.outputs.commit }}
          token: ${{ steps.release_token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          show-progress: false

      # The release notes script runs on plain Node with builtins only, so no install is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        env:
          RELEASE_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          git config user.name "nocobase[bot]"
          git config user.email "179432756+nocobase[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/nocobase/studio.git"

      # A tag already on the released commit is a retried run; anywhere else it is a conflict.
      - name: Tag the released commit
        id: tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          tag="v${VERSION}"
          # ls-remote lists an annotated tag's peeled `^{}` line after the tag itself, and that line is the commit.
          remote=$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | awk '{ print $1 }' | tail -n 1)
          if [ -n "$remote" ]; then
            if [ "$remote" != "$COMMIT" ]; then
              echo "::error::nocobase/studio's tag ${tag} points to ${remote} instead of the released commit ${COMMIT}."
              exit 1
            fi
            echo "Tag ${tag} already points to the released commit."
          else
            git tag "$tag" "$COMMIT"
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # The script is the released commit's own, so the notes follow the PR template that commit was developed under; a
      # commit older than the script has no notes. It reads every pull request in `<previous tag>..v<version>` through gh,
      # hence the write token (pull requests read is all it uses). scripts/release is copied out of the checkout because
      # the latest channel runs it again later from a checkout of dev, which may hold a different version of it.
      # For beta it also prepends the version to CHANGELOG.md and CHANGELOG.zh-CN.md in the working tree, which the bump
      # commit then carries. Any failure is a warning: a half-written changelog is restored and the release goes on
      # without notes.
      - name: Write the release notes
        id: notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          notes="${RUNNER_TEMP}/notes"
          tools="${RUNNER_TEMP}/studio-release-scripts"
          available=false
          changelog=false
          if [ ! -f scripts/release/release-notes.mjs ]; then
            echo "::warning::The released commit has no scripts/release/release-notes.mjs; this release has no release notes."
          else
            cp -R scripts/release "$tools"
            args=(--tag "v${VERSION}" --channel "$CHANNEL" --repo nocobase/studio --out-dir "$notes")
            if [ "$CHANNEL" = "beta" ]; then args+=(--changelog-root .); fi
            if node "$tools/release-notes.mjs" "${args[@]}"; then
              available=true
            else
              echo "::warning::Writing the release notes failed; this release goes on without them."
              rm -rf "$notes"
              for file in CHANGELOG.md CHANGELOG.zh-CN.md; do
                if git ls-files --error-unmatch -- "$file" > /dev/null 2>&1; then
                  git checkout HEAD -- "$file"
                else
                  rm -f -- "$file"
                fi
              done
            fi
          fi
          if [ "$available" = "true" ] && [ -n "$(git status --porcelain -- CHANGELOG.md CHANGELOG.zh-CN.md)" ]; then
            changelog=true
          fi
          {
            echo "available=${available}"
            echo "changelog=${changelog}"
          } >> "$GITHUB_OUTPUT"

      # Only the top-level "version" line changes, so each file keeps its formatting byte for byte; the check then
      # confirms nothing but the version differs. defaultTemplateVersion and the submodule are left alone. A beta bump
      # also commits the changelogs the release notes step wrote, so `dev` gets them in the same squashed commit.
      - name: Bump the version
        env:
          NEXT: ${{ needs.prepare.outputs.next_version }}
          BUMP_BRANCH: ${{ needs.prepare.outputs.bump_branch }}
          CHANGELOG: ${{ steps.notes.outputs.changelog }}
        run: |
          git checkout -b "$BUMP_BRANCH"
          for manifest in package.json packages/studio-cli/package.json; do
            # shellcheck disable=SC2016 # the single-quoted script is JavaScript, its ${} is a template literal
            node -e '
              const fs = require("fs");
              const [file, next] = process.argv.slice(1);
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(/^(  "version": ")[^"]*(")/m, `$1${next}$2`);
              const a = JSON.parse(before);
              const b = JSON.parse(after);
              if (b.version !== next) throw new Error(`${file}: no top-level version to bump`);
              delete a.version;
              delete b.version;
              if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${file}: the bump changed more than the version`);
              fs.writeFileSync(file, after);
            ' "$manifest" "$NEXT"
          done
          git add package.json packages/studio-cli/package.json
          if [ "$CHANGELOG" = "true" ]; then
            for file in CHANGELOG.md CHANGELOG.zh-CN.md; do
              if [ -e "$file" ]; then git add -- "$file"; fi
            done
          fi
          git diff --cached
          git commit -m "chore: bump studio version to ${NEXT} [skip ci]"
          git push origin "refs/heads/${BUMP_BRANCH}:refs/heads/${BUMP_BRANCH}"

      # Squashed like every other pull request. gh runs outside the checkout so --delete-branch only deletes the remote
      # branch, and a non-zero exit is checked against the pull request's state before it counts as a failed merge.
      # Conflicts (the source branch changed a version meanwhile) leave the branch for manual resolution.
      - name: Merge the bump back
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          BUMP_BRANCH: ${{ needs.prepare.outputs.bump_branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NEXT: ${{ needs.prepare.outputs.next_version }}
          CHANGELOG: ${{ steps.notes.outputs.changelog }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject="chore: bump studio version to ${NEXT} [skip ci]"
          body="Studio \`${VERSION}\` was released as \`${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}\` and tagged \`v${VERSION}\`; this moves \`${SOURCE_BRANCH}\` on to \`${NEXT}\`."
          if [ "$CHANGELOG" = "true" ]; then body="${body} It also adds \`v${VERSION}\` to CHANGELOG.md and CHANGELOG.zh-CN.md."; fi
          pr_url=$(gh pr create -R nocobase/studio \
            --base "$SOURCE_BRANCH" \
            --head "$BUMP_BRANCH" \
            --title "$subject" \
            --body "${body} Released by ${RUN_URL}")
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

          cd "$RUNNER_TEMP"
          set +e
          gh pr merge "$pr_url" -R nocobase/studio --squash --delete-branch --subject "$subject"
          rc=$?
          set -e
          state=$(gh pr view "$pr_url" -R nocobase/studio --json state --jq .state || echo UNKNOWN)
          if [ "$rc" = "0" ] || [ "$state" = "MERGED" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Failed to merge the version bump into ${SOURCE_BRANCH}; it needs manual work: ${pr_url}"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      # The changelogs live on `dev`, the branch every release line starts from, so a latest release writes them there
      # rather than into its version-only bump of `main`. The script copied from the released commit runs on a fresh
      # `origin/dev`; with the tag pushed, it finds the same previous stable tag and range as the notes above, and a
      # version already in the changelogs is left alone, so a retried run changes nothing. Merged like the bump; any
      # failure is a warning (result=failed, or result=open with the pull request left for a person) and never fails
      # the run, since the release itself is complete.
      - name: Write the changelog into dev
        id: changelog
        continue-on-error: true
        if: ${{ inputs.channel == 'latest' && steps.notes.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG_BRANCH: release/studio-${{ needs.prepare.outputs.version }}-changelog
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fail() {
            echo "::warning::Writing the changelog of v${VERSION} into dev failed: $1. Add it to CHANGELOG.md and CHANGELOG.zh-CN.md on dev by hand."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          }
          subject="docs: update studio changelog for v${VERSION} [skip ci]"
          git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev" || fail "fetching dev"
          git checkout -B "$CHANGELOG_BRANCH" origin/dev || fail "checking out dev"
          node "${RUNNER_TEMP}/studio-release-scripts/release-notes.mjs" \
            --tag "v${VERSION}" --channel latest --repo nocobase/studio \
            --out-dir "${RUNNER_TEMP}/notes-dev" --changelog-root . || fail "the release notes script exited non-zero"
          if [ -z "$(git status --porcelain -- CHANGELOG.md CHANGELOG.zh-CN.md)" ]; then
            echo "dev's changelogs already have v${VERSION}."
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in CHANGELOG.md CHANGELOG.zh-CN.md; do
            if [ -e "$file" ]; then git add -- "$file"; fi
          done
          git diff --cached --stat
          git commit -m "$subject" || fail "committing"
          git push origin "refs/heads/${CHANGELOG_BRANCH}:refs/heads/${CHANGELOG_BRANCH}" || fail "pushing ${CHANGELOG_BRANCH}"
          pr_url=$(gh pr create -R nocobase/studio \
            --base dev \
            --head "$CHANGELOG_BRANCH" \
            --title "$subject" \
            --body "Adds Studio \`v${VERSION}\`, released from \`main\`, to CHANGELOG.md and CHANGELOG.zh-CN.md. Released by ${RUN_URL}") \
            || fail "opening the pull request from ${CHANGELOG_BRANCH}"
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

          cd "$RUNNER_TEMP"
          set +e
          gh pr merge "$pr_url" -R nocobase/studio --squash --delete-branch --subject "$subject"
          rc=$?
          set -e
          state=$(gh pr view "$pr_url" -R nocobase/studio --json state --jq .state || echo UNKNOWN)
          if [ "$rc" = "0" ] || [ "$state" = "MERGED" ]; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Failed to merge the changelog of v${VERSION} into dev; it needs manual work: ${pr_url}"
            echo "result=open" >> "$GITHUB_OUTPUT"
          fi

      # Runs whenever the tag exists, even when the bump failed: the image and the tag are out, so the release is real.
      # An existing release (a retried run, or one written by hand) is left alone. Without notes the release gets a
      # one-line body. Failure is a warning only.
      - name: Create the GitHub release
        id: github_release
        continue-on-error: true
        if: ${{ !cancelled() && steps.tag.outputs.tagged == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTES_AVAILABLE: ${{ steps.notes.outputs.available }}
        run: |
          tag="v${VERSION}"
          cd "$RUNNER_TEMP"
          if url=$(gh release view "$tag" -R nocobase/studio --json url --jq .url 2> /dev/null); then
            echo "nocobase/studio already has the release ${tag}; it is left alone: ${url}"
            {
              echo "result=exists"
              echo "url=${url}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes_file="${RUNNER_TEMP}/notes/release-notes.en.md"
          if [ "$NOTES_AVAILABLE" != "true" ] || [ ! -s "$notes_file" ]; then
            notes_file="${RUNNER_TEMP}/release-body.md"
            echo "NocoBase Studio ${VERSION}: \`${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}\`." > "$notes_file"
          fi
          args=("$tag" -R nocobase/studio --verify-tag --title "$tag" --notes-file "$notes_file")
          if [ "$CHANNEL" = "beta" ]; then args+=(--prerelease --latest=false); fi
          if gh release create "${args[@]}"; then
            url=$(gh release view "$tag" -R nocobase/studio --json url --jq .url || echo "https://github.com/nocobase/studio/releases/tag/${tag}")
            {
              echo "result=created"
              echo "url=${url}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Creating the GitHub release ${tag} of nocobase/studio failed; create it by hand."
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: ${{ always() }}
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
          TAGGED: ${{ steps.tag.outputs.tagged }}
          MERGED: ${{ steps.merge.outputs.merged }}
          PR_URL: ${{ steps.merge.outputs.url }}
          NEXT: ${{ needs.prepare.outputs.next_version }}
          CHANNEL: ${{ inputs.channel }}
          NOTES_AVAILABLE: ${{ steps.notes.outputs.available }}
          BETA_CHANGELOG: ${{ steps.notes.outputs.changelog }}
          CHANGELOG_RESULT: ${{ steps.changelog.outputs.result }}
          CHANGELOG_URL: ${{ steps.changelog.outputs.url }}
          RELEASE_RESULT: ${{ steps.github_release.outputs.result }}
          RELEASE_URL: ${{ steps.github_release.outputs.url }}
        run: |
          notes="${RUNNER_TEMP}/notes"
          if [ "$CHANNEL" = "beta" ]; then
            if [ "$BETA_CHANGELOG" = "true" ]; then changelog="in the bump to \`${NEXT}\`"; else changelog="not written"; fi
          else
            case "$CHANGELOG_RESULT" in
              merged) changelog="merged into \`dev\`: ${CHANGELOG_URL}" ;;
              unchanged) changelog="\`dev\` already had it" ;;
              open) changelog="**not merged, needs manual work**: ${CHANGELOG_URL}" ;;
              failed) changelog="**failed**, add it to \`dev\` by hand" ;;
              *) changelog="not written" ;;
            esac
          fi
          {
            echo '### Published'
            echo
            echo "Index \`${DIGEST}\`, tagged:"
            echo
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "- \`${REGISTRY}/${IMAGE_REPOSITORY}:${tag}\`"; fi
            done <<< "$TAGS"
            echo
            echo "- Git tag \`v${VERSION}\`: ${TAGGED:-not pushed}"
            echo "- Bump to \`${NEXT}\`: ${PR_URL:-no pull request} (merged: ${MERGED:-no})"
            echo "- GitHub release: ${RELEASE_URL:-not created} (${RELEASE_RESULT:-skipped})"
            echo "- Changelog: ${changelog}"
            echo
            echo "\`docker pull ${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}\`"
            echo
            echo '### Release notes'
            echo
            if [ "$NOTES_AVAILABLE" = "true" ] && [ -f "${notes}/release-notes.en.md" ]; then
              cat "${notes}/release-notes.en.md"
              echo
              if [ -f "${notes}/missing.json" ] && [ "$(jq 'length' "${notes}/missing.json" 2> /dev/null || echo 0)" != "0" ]; then
                echo '#### Pull requests without a valid description'
                echo
                echo 'These are missing from the notes above; fix their descriptions and edit the release by hand.'
                echo
                jq -r '.[] | "- [#\(.number)](\(.url)) \(.title): \(.reason)"' "${notes}/missing.json"
              fi
            else
              echo 'None: the released commit has no release notes script, or it failed (see the warnings).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out workflow tooling
        if: ${{ steps.merge.outputs.merged != '' }}
        uses: actions/checkout@v4
        with:
          path: workflow-tooling
          sparse-checkout: scripts
          persist-credentials: false

      - name: Notify merge failure
        if: ${{ steps.merge.outputs.merged == 'false' }}
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/studio
          TITLE: NocoBase Studio 镜像发布成功，但版本号合回失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工介入
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: |
            镜像 **${{ needs.prepare.outputs.version }}**（channel `${{ inputs.channel }}`）已推送到私有源，git tag `v${{ needs.prepare.outputs.version }}` 已打。

            但把版本号改成 `${{ needs.prepare.outputs.next_version }}` 的 PR 合回 `${{ needs.prepare.outputs.source_branch }}` 失败，需要人工处理：
            ${{ steps.merge.outputs.url }}

            分支 `${{ needs.prepare.outputs.bump_branch }}` 已保留。**合回之前不要再次发布**，否则会因为版本号已存在而失败。
        run: workflow-tooling/scripts/feishu-notify.sh

      - name: Fail the run when merge back failed
        if: ${{ steps.merge.outputs.merged == 'false' }}
        run: exit 1

      - name: Notify success
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/studio
          TITLE: NocoBase Studio 镜像发布
          STATUS: success
          STATUS_TEXT_SUCCESS: 发布成功
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG_LIST: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          NEXT: ${{ needs.prepare.outputs.next_version }}
          LATEST_REASON: ${{ needs.prepare.outputs.latest_reason }}
          RELEASE_URL: ${{ steps.github_release.outputs.url }}
          NOTES_AVAILABLE: ${{ steps.notes.outputs.available }}
          CHANGELOG_RESULT: ${{ steps.changelog.outputs.result }}
          CHANGELOG_URL: ${{ steps.changelog.outputs.url }}
        run: |
          notes="${RUNNER_TEMP}/notes"
          tag_list=
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tag_list="${tag_list:+${tag_list} }\`${tag}\`"; fi
          done <<< "$TAG_LIST"
          # The card stays readable and under Feishu's size limit: the Chinese notes are cut at a line boundary within
          # 3000 characters (code points, not bytes), and the full notes are one click away on the release.
          nl=$'\n'
          extra=
          case "$CHANGELOG_RESULT" in
            open) extra="⚠️ CHANGELOG 合入 \`dev\` 的 PR 没有合并成功，需要人工处理：${CHANGELOG_URL}" ;;
            failed) extra="⚠️ CHANGELOG 写入 \`dev\` 失败，需要手动补上 \`v${VERSION}\`，详见构建日志。" ;;
          esac
          if [ -n "$RELEASE_URL" ]; then
            extra="${extra:+${extra}${nl}}GitHub Release：${RELEASE_URL}"
          else
            extra="${extra:+${extra}${nl}}⚠️ GitHub Release 没有创建成功，需要手动创建。"
          fi
          if [ "$NOTES_AVAILABLE" = "true" ] && [ -s "${notes}/release-notes.zh-CN.md" ]; then
            # shellcheck disable=SC2016 # the single-quoted script is JavaScript
            zh=$(node -e '
              const fs = require("fs");
              const [file, max] = [process.argv[1], Number(process.argv[2])];
              const chars = Array.from(fs.readFileSync(file, "utf8").trim());
              if (chars.length <= max) {
                process.stdout.write(chars.join(""));
              } else {
                let cut = chars.slice(0, max).join("");
                const newline = cut.lastIndexOf("\n");
                if (newline > max / 2) cut = cut.slice(0, newline);
                process.stdout.write(cut + "\n\n……（已截断，完整内容见 GitHub Release）");
              }
            ' "${notes}/release-notes.zh-CN.md" 3000)
            missing=0
            if [ -f "${notes}/missing.json" ]; then missing=$(jq 'length' "${notes}/missing.json" 2> /dev/null || echo 0); fi
            if [ "$missing" != "0" ]; then
              zh="${zh}${nl}${nl}⚠️ 有 ${missing} 个 PR 缺少有效的描述，没有进入更新说明，列表见构建详情。"
            fi
          else
            zh="（没有生成更新说明，详见构建日志。）"
          fi
          CONTENT=$(printf '%s\n' \
            "版本 **${VERSION}** 已发布（channel \`${CHANNEL}\`，来自 \`${SOURCE_BRANCH}\` 的 \`${COMMIT:0:7}\`）。" \
            "" \
            "推送的标签：${tag_list}" \
            "latest：${LATEST_REASON}" \
            "" \
            "\`docker pull ${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}\`" \
            "" \
            "已打 git tag \`v${VERSION}\`，\`${SOURCE_BRANCH}\` 的版本号已改为 \`${NEXT}\`。" \
            "$extra" \
            "" \
            "---" \
            "" \
            "**更新说明**" \
            "" \
            "$zh")
          export CONTENT
          workflow-tooling/scripts/feishu-notify.sh

  # Covers failures in every job; a failed merge back is notified by the release job itself.
  notify-failure:
    name: Notify release failure
    needs: [prepare, image, manifest, release]
    if: >-
      always() && !cancelled() && !inputs.dry_run
      && needs.release.outputs.merged != 'false'
      && (needs.prepare.result == 'failure' || needs.image.result == 'failure' || needs.manifest.result == 'failure'
        || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # What already happened decides what needs attention: a pushed image or tag cannot be released again under the
      # same version.
      - name: Notify failure
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/studio
          TITLE: NocoBase Studio 镜像发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发布中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          TAGGED: ${{ needs.release.outputs.tagged }}
        run: |
          if [ "$TAGGED" = "true" ]; then
            state="镜像已推送，git tag \`v${VERSION}\` 已打，但版本号加一没有完成，需要手动把 studio 的版本号改成下一个版本。"
          elif [ "$MANIFEST_RESULT" = "success" ]; then
            state="镜像已推送到私有源，但 git tag \`v${VERSION}\` 没有打上，版本号也没有加一，需要手动补上。"
          else
            state="镜像标签没有推送（按 digest 推送的单平台镜像可能已经上传，不影响重新发布）。修复后可以重新发布同一个版本。"
          fi
          CONTENT=$(printf '%s\n' \
            "Studio ${VERSION:+**${VERSION}** }发布中断（channel \`${CHANNEL}\`），请查看 Actions 日志确认失败阶段。" \
            "" \
            "$state")
          export CONTENT
          scripts/feishu-notify.sh
