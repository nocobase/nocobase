# The default-branch entry delegates to the maintained v3 implementation.
name: V3 Studio Release
run-name: studio-release:${{ inputs.channel }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta releases studio dev; latest releases studio main'
        type: choice
        options:
          - beta
          - latest
        default: beta
      dry_run:
        description: 'Dry run: resolve, validate and build without pushing, tagging or merging anything'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Run the v3 implementation
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch on v3-develop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: v3-studio-release.yml
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: |
          printf '%s' "$DISPATCH_INPUTS" \
            | jq '{ref: "v3-develop", inputs: with_entries(.value |= tostring)}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" --input -
          echo "Dispatched $WORKFLOW_FILE on v3-develop. Check that workflow run for its result." >> "$GITHUB_STEP_SUMMARY"
