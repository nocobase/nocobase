name: V3 Release Pro Stable

# Publishes commercial packages from the private Pro repository without transferring its source or package archives
# through public-repository artifacts. The Pro repository remains the owner of every branch, tag, PR, and Release.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pro branch to release'
        type: string
        default: main
      keep_latest:
        description: 'Publish an older branch under legacy without moving latest'
        type: boolean
        default: false
      oss_sha:
        description: 'Exact OSS main commit to pin (empty selects main once at job start)'
        type: string
        required: false
      dry_run:
        description: 'Build and test without publishing or writing to the Pro repository'
        type: boolean
        default: false
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      keep_latest:
        type: boolean
        default: false
      oss_sha:
        description: 'Exact OSS v3-main stable release commit'
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    secrets:
      NOCOBASE_APP_PRIVATE_KEY:
        required: true
      PRO_NPM_REGISTRY:
        required: true
      PRO_NPM_TOKEN:
        required: true
      RELEASE_RESULT_FEISHU_WEBHOOK_URL:
        required: false

concurrency:
  group: pro-release-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Pro stable
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Preserve trusted release tooling
        uses: actions/checkout@v4
        with:
          path: .workflow-tools
          persist-credentials: false

      - name: Copy release tooling outside the checkout
        run: cp .workflow-tools/scripts/reconcile-pro-release-metadata.mjs "$RUNNER_TEMP/reconcile-pro-release-metadata.mjs"

      - name: Create a read token for the Pro repository
        id: checkout_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: read

      - name: Validate the Pro branch name
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in ''|-*) echo '::error::Invalid Pro release branch'; exit 1 ;; esac
          git check-ref-format --branch "$BRANCH"

      - name: Check out the Pro release line
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3-pro
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.checkout_token.outputs.token }}
          persist-credentials: false

      - name: Configure the Pro read remote
        env:
          PRO_TOKEN: ${{ steps.checkout_token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Validate the Pro npm registry
        env:
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
        run: |
          node -e '
            const value = process.env.PRO_NPM_REGISTRY?.trim();
            if (!value) { console.error("::error::PRO_NPM_REGISTRY is not configured"); process.exit(1); }
            let registry;
            try { registry = new URL(value); } catch { console.error("::error::PRO_NPM_REGISTRY is not a valid URL"); process.exit(1); }
            if (registry.hostname === "registry.npmjs.org") { console.error("::error::Commercial packages must not use public npm"); process.exit(1); }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ secrets.PRO_NPM_REGISTRY }}
          scope: '@nocobase'

      - name: Verify stable release inputs
        env:
          BRANCH: ${{ inputs.branch }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
        run: |
          test "$BRANCH" != develop || { echo '::error::Use the Pro beta release for develop'; exit 1; }
          test ! -f .changeset/pre.json || { echo "::error::$BRANCH is still in prerelease mode; promote it before publishing stable packages"; exit 1; }
          if [ "$BRANCH" != main ] && [ "$KEEP_LATEST" != true ]; then
            echo '::error::A non-main stable release must keep latest and publish under legacy'
            exit 1
          fi

      - name: Resolve the dist-tag
        id: disttag
        env:
          KEEP_LATEST: ${{ inputs.keep_latest }}
        run: |
          if [ "$KEEP_LATEST" = true ]; then echo 'value=legacy' >> "$GITHUB_OUTPUT"; else echo 'value=latest' >> "$GITHUB_OUTPUT"; fi

      - name: Freeze the OSS v3-main snapshot and install
        id: oss
        env:
          OSS_SHA: ${{ inputs.oss_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
        run: |
          ARGS=(--branch main)
          if [ -n "$OSS_SHA" ]; then ARGS+=(--sha "$OSS_SHA"); fi
          node ./scripts/sync-release-oss.mjs "${ARGS[@]}"

      - name: Prepare stable versions and branch
        id: release
        run: |
          git config user.name 'nocobase[bot]'
          git config user.email '179432756+nocobase[bot]@users.noreply.github.com'
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          echo "needs_version=$([ "$COUNT" = 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" != 0 ]; then
            node ./vendor/nocobase3/scripts/list-package-versions.mjs > "$RUNNER_TEMP/pro-versions-before.json"
          fi
          git fetch origin --tags --force
          DAY=$(date -u +%Y-%m-%d)
          MAX=0
          for TAG in $(git tag -l "release/${DAY}.*"); do
            NUMBER="${TAG##*.}"
            case "$NUMBER" in ''|*[!0-9]*) continue ;; esac
            [ "$NUMBER" -gt "$MAX" ] && MAX="$NUMBER"
          done
          BATCH="${DAY}.$((MAX + 1))"
          NAME="release/$BATCH"
          git checkout -b "$NAME"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Version Pro packages when needed
        id: changed
        env:
          NEEDS_VERSION: ${{ steps.release.outputs.needs_version }}
        run: |
          if [ "$NEEDS_VERSION" = true ]; then
            pnpm changeset version
            CHANGED=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --changed "$RUNNER_TEMP/pro-versions-before.json")
            test -n "$CHANGED" || { echo '::error::Pro changesets changed no package versions'; exit 1; }
            echo "$CHANGED"
            echo "rows=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --released-rows "$RUNNER_TEMP/pro-versions-before.json")" >> "$GITHUB_OUTPUT"
          fi
          LEFT=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --prerelease)
          test -z "$LEFT" || { echo "::error::Stable Pro release contains prerelease versions: $LEFT"; exit 1; }

      - name: Build and test Pro
        run: |
          pnpm build
          pnpm test

      - name: Verify Pro packages in OSS Default
        uses: ./.github/actions/verify-create-app

      - name: Stop after validation
        if: inputs.dry_run
        run: echo 'dry_run=true — no branch, tag, package, PR, or GitHub Release was written.'

      - name: Create a fresh Pro write token
        if: '!inputs.dry_run'
        id: write_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase3-pro
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push changed release metadata
        if: '!inputs.dry_run'
        id: commit
        env:
          PRO_TOKEN: ${{ steps.write_token.outputs.token }}
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:${PRO_TOKEN}@github.com/nocobase/nocobase3-pro.git"
          git add -A
          test "$(git -C vendor/nocobase3 rev-parse HEAD)" = "$OSS_SHA"
          test "$(git ls-files --stage vendor/nocobase3 | awk '{print $2}')" = "$OSS_SHA"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release ${{ steps.release.outputs.batch }} [skip ci]"
            git push origin "refs/heads/${{ steps.release.outputs.name }}:refs/heads/${{ steps.release.outputs.name }}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Pro packages and tag a non-empty release
        if: '!inputs.dry_run'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRO_NPM_TOKEN }}
          PRO_NPM_REGISTRY: ${{ secrets.PRO_NPM_REGISTRY }}
          TAG: ${{ steps.release.outputs.name }}
          DIST_TAG: ${{ steps.disttag.outputs.value }}
        run: |
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/pro-tags-before.txt"
          node ./scripts/publish-commercial-packages.mjs --registry "$PRO_NPM_REGISTRY" --tag "$DIST_TAG"
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/pro-tags-after.txt"
          NEW_TAGS=$(comm -13 "$RUNNER_TEMP/pro-tags-before.txt" "$RUNNER_TEMP/pro-tags-after.txt")
          if [ -z "$NEW_TAGS" ]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'No new commercial package versions were published; keeping only the tested OSS metadata update.'
          else
            echo "$NEW_TAGS"
            git tag "$TAG"
            git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git push origin --tags
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Merge release metadata back into Pro
        if: "!inputs.dry_run && steps.commit.outputs.changed == 'true'"
        id: merge
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          PR_URL=$(gh pr create --repo nocobase/nocobase3-pro \
            --title "chore: release ${{ steps.release.outputs.batch }}" \
            --body "Stable release \`${{ steps.release.outputs.batch }}\` published from \`$BRANCH\` using OSS commit \`${{ steps.oss.outputs.sha }}\`." \
            --base "$BRANCH" --head "${{ steps.release.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge --repo nocobase/nocobase3-pro "$PR_URL" --merge --delete-branch

      - name: Sync a main release into Pro develop
        if: "!inputs.dry_run && inputs.branch == 'main' && steps.release.outputs.needs_version == 'true' && steps.merge.outcome == 'success'"
        env:
          OSS_SHA: ${{ steps.oss.outputs.sha }}
        run: |
          git fetch origin main develop
          git checkout -B develop origin/develop
          DEVELOP_BASE=$(git rev-parse HEAD)
          DEVELOP_OSS_SHA=$(git rev-parse HEAD:vendor/nocobase3)
          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_RC=$?
          set -e
          node "$RUNNER_TEMP/reconcile-pro-release-metadata.mjs" \
            --metadata-source "$DEVELOP_BASE" --oss-sha "$DEVELOP_OSS_SHA"
          if [ "$MERGE_RC" != 0 ]; then node ./vendor/nocobase3/scripts/resolve-sync-conflicts.mjs; fi
          test -z "$(git diff --name-only --diff-filter=U)" || { echo '::error::Unresolved Pro stable sync conflicts remain'; exit 1; }
          test -f .changeset/pre.json || { echo '::error::Pro develop lost prerelease mode'; exit 1; }
          CI=true pnpm install --no-frozen-lockfile
          git add -A
          git commit -m "chore: sync ${{ steps.release.outputs.batch }} into develop [skip ci]"
          git push origin develop

      - name: Create the Pro GitHub Release
        if: "!inputs.dry_run && steps.publish.outputs.published == 'true'"
        env:
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          TAG: ${{ steps.release.outputs.name }}
        run: |
          node ./vendor/nocobase3/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/pro-release-notes.raw.md"
          sed -e 's#https://github.com/nocobase/nocobase3/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' \
              -e 's#https://github.com/nocobase/nocobase/blob/#https://github.com/nocobase/nocobase3-pro/blob/#g' "$RUNNER_TEMP/pro-release-notes.raw.md" > "$RUNNER_TEMP/pro-release-notes.md"
          TITLE="${TAG##*/}"
          if gh release view --repo nocobase/nocobase3-pro "$TAG" > /dev/null 2>&1; then
            gh release edit --repo nocobase/nocobase3-pro "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" --latest
          else
            gh release create --repo nocobase/nocobase3-pro "$TAG" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/pro-release-notes.md" --latest
          fi

      - name: Notify success
        if: '!inputs.dry_run && success()'
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          REGISTRY_URL: ${{ secrets.PRO_NPM_REGISTRY }}
          TITLE: NocoBase 3 Pro 稳定版发布
          STATUS: success
          STATUS_TEXT_SUCCESS: 发布成功
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/nocobase/nocobase3-pro/releases
          TABLE_JSON: ${{ steps.changed.outputs.rows }}
          CONTENT: ${{ steps.publish.outputs.published == 'true' && format('已发布到私有 npm（dist-tag `{0}`）。', steps.disttag.outputs.value) || '没有新的商业包需要发布；已验证并同步本次 OSS metadata。' }}
        run: ./vendor/nocobase3/scripts/feishu-notify.sh

      - name: Notify failure
        if: failure() && !inputs.dry_run
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_RESULT_FEISHU_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: nocobase/nocobase3-pro
          TITLE: NocoBase 3 Pro 稳定版发布失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 发版中断
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTENT: 请检查 OSS 仓库中的 Pro 发版运行；若 publish 已执行，重跑前先确认私有 registry 状态。
        run: ./vendor/nocobase3/scripts/feishu-notify.sh
