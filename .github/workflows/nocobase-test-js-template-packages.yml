name: JS Template package boundary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
      - develop
    paths:
      - 'package.json'
      - '**/yarn.lock'
      - 'tsconfig.json'
      - 'tsconfig.paths.json'
      - 'packages/**/package.json'
      - 'packages/core/build/**'
      - 'packages/core/cli-v1/src/commands/build.js'
      - 'packages/core/client-v2/package.json'
      - 'packages/core/client-v2/src/flow/components/code-editor/**'
      - 'packages/core/runjs/**'
      - 'packages/plugins/@nocobase/plugin-js-template/**'
      - '.github/workflows/nocobase-test-js-template-packages.yml'
  pull_request:
    paths:
      - 'package.json'
      - '**/yarn.lock'
      - 'tsconfig.json'
      - 'tsconfig.paths.json'
      - 'packages/**/package.json'
      - 'packages/core/build/**'
      - 'packages/core/cli-v1/src/commands/build.js'
      - 'packages/core/client-v2/package.json'
      - 'packages/core/client-v2/src/flow/components/code-editor/**'
      - 'packages/core/runjs/**'
      - 'packages/plugins/@nocobase/plugin-js-template/**'
      - '.github/workflows/nocobase-test-js-template-packages.yml'

jobs:
  package-boundary:
    name: package-boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build dependency closure, RunJS, and JS Template plugin
        run: yarn build @nocobase/runjs @nocobase/plugin-js-template --with-deps

      - name: Verify packed package boundaries
        run: node packages/core/runjs/scripts/verify-package-boundary.mjs --repository-root "${{ github.workspace }}"
