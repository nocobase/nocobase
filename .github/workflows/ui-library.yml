name: UI Library

on:
  push:
    branches:
      - develop
    paths:
      - 'ui-library/**'
      - '.github/workflows/ui-library.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'ui-library/**'
      - '.github/workflows/ui-library.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the build to OSS (only publishes when the selected ref is develop)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ui-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The ESLint configuration imports the shared factories from @nocobase/dev-config, whose exports resolve to its
      # compiled output.
      - name: Build shared development config
        run: pnpm dev-config:build

      - name: Lint UI Library
        run: pnpm --filter @nocobase/ui-library lint

      # `build` is `shadcn build && vite build`, and Vite does not type-check, so this is the only step that would
      # catch a TypeScript error before it is published. It also compiles the registry sources the way a plugin does,
      # against the real workspace packages the items import.
      - name: Typecheck UI Library
        run: pnpm --filter @nocobase/ui-library typecheck

      # The Quality workflow runs these on every pull request too; running them here keeps a merge that breaks an
      # item's behavior from reaching the bucket.
      - name: Test UI Library
        run: pnpm --filter @nocobase/ui-library test

      - name: Build UI Library
        run: pnpm --filter @nocobase/ui-library build

      - name: Verify build output
        working-directory: ui-library
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/favicon.ico
          test -d dist/assets
          # The publish step uploads the registry index by name, so its absence has to fail here rather than after
          # every other object has already been uploaded. The entry files are derived from the index instead of being
          # listed: `shadcn build` decides what it writes, and a check naming them would go stale as items are added.
          test -s dist/r/registry.json
          jq -r '.items[].name' dist/r/registry.json | while IFS= read -r name; do
            test -s "dist/r/$name.json" || { echo "::error::Registry index lists '$name' but dist/r/$name.json is missing."; exit 1; }
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-library-dist
          path: ui-library/dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish to OSS
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop')
        env:
          UI_LIBRARY_ALI_OSS_ACCESS_KEY_ID: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_ID }}
          UI_LIBRARY_ALI_OSS_ACCESS_KEY_SECRET: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_SECRET }}
          # The bucket and the region name the destination rather than authenticating to it, so they are written here
          # where a reviewer can read them. In a repository secret a value nobody can inspect is one mistyped
          # character away from a failure that reports an endpoint that appears nowhere in the repository.
          UI_LIBRARY_ALI_OSS_BUCKET: nocobase-ui-library
          UI_LIBRARY_ALI_OSS_REGION: cn-beijing
          # ossutil reads the credentials from these names rather than the UI_LIBRARY_-prefixed ones.
          OSS_ACCESS_KEY_ID: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_SECRET }}
        working-directory: ui-library
        run: |
          set -euo pipefail

          for name in UI_LIBRARY_ALI_OSS_ACCESS_KEY_ID UI_LIBRARY_ALI_OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Configure the repository secret before publishing."
              exit 1
            fi
          done

          curl -fsSL -o /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.2.2/ossutil-2.2.2-linux-amd64.zip
          unzip -o -q /tmp/ossutil.zip -d /tmp/ossutil
          sudo mv /tmp/ossutil/ossutil-2.2.2-linux-amd64/ossutil /usr/local/bin/ossutil
          sudo chmod 755 /usr/local/bin/ossutil

          BUCKET="$UI_LIBRARY_ALI_OSS_BUCKET"
          # ossutil takes the bare region id and derives `<bucket>.oss-<region>.aliyuncs.com` from it;
          # `--region oss-cn-beijing` is rejected outright, which is why the value above carries no `oss-` prefix.
          REGION="$UI_LIBRARY_ALI_OSS_REGION"
          ENDPOINT="oss://$BUCKET"

          # Upload every generated file except the two indexes. Existing objects are kept when a later step fails.
          # Only Vite's content-hashed bundles can be cached forever; the files copied from `public/` keep their names
          # across releases, so a long cache on those would keep serving a replaced logo or favicon.
          while IFS= read -r -d '' file; do
            relative="${file#./dist/}"
            case "$relative" in
              index.html|r/registry.json) continue ;;
              r/*) CACHE_CONTROL='no-cache' ;;
              assets/*-*.js|assets/*-*.css) CACHE_CONTROL='public,max-age=31536000,immutable' ;;
              *) CACHE_CONTROL='public,max-age=86400' ;;
            esac
            ossutil cp "$file" "$ENDPOINT/$relative" \
              -f --region "$REGION" --cache-control "$CACHE_CONTROL"
          done < <(find ./dist -type f -print0 | sort -z)

          # Upload the registry index after its entries so it never points at a missing item.
          ossutil cp ./dist/r/registry.json "$ENDPOINT/r/registry.json" \
            -f --region "$REGION" --cache-control 'no-cache'

          # Publish the entry point last. This is ordered for the static website's root URL, while retaining old
          # objects if any upload fails; OSS object replacement itself is not an atomic whole-site deployment.
          ossutil cp ./dist/index.html "$ENDPOINT/index.html" \
            -f --region "$REGION" --cache-control 'no-cache' --content-type 'text/html; charset=utf-8'

          {
            echo '### UI Library published'
            echo
            echo 'Published build: https://ui.nocobase.com/'
            echo 'Registry: https://ui.nocobase.com/r/registry.json'
          } >> "$GITHUB_STEP_SUMMARY"
