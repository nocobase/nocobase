name: V3 Studio image

# NocoBase Studio's public release image, built from a v3 release's aggregate tag after the release published
# @nocobase/studio to npm, and pushed to Docker Hub and Aliyun's public registry as nocobase/studio:<version> and
# :beta (or :latest for a version without a prerelease part), like the v2 release images. Studio's `pnpm build` packs
# the universal (Node-free) nocobase-runner and nb-studio packages at the exact versions it records into
# dist/runners, so the image serves the runner and CLI it was built with, including to runners installed from a
# package, which can only update from one.
#
# The image is published for linux/amd64 and linux/arm64. Each architecture gets its own dist/, built with that
# architecture's `pnpm build --target`, because dist/ carries native modules (better-sqlite3, sqlite-vec) for one
# platform and the Dockerfile refuses a prebuilt dist/ whose recorded target differs from the image. arm64 builds on a
# native ARM runner, so neither the build nor the image's own RUN steps go through emulation. Each architecture is
# pushed by digest, and `publish` joins them into one multi-architecture image under every tag.
#
# Internal images (dev versions of Studio, nb-studio and the runner) are built in 2013xile/nocobase-ci and pushed to the
# internal registry instead.
#
# The beta release calls this; re-run its job from the release run to rebuild an image.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Aggregate release tag to build, e.g. release-beta/2026-10-11.1'
        type: string
        required: true

permissions:
  contents: read

jobs:
  tags:
    name: Name the Studio image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          show-progress: false
          sparse-checkout: packages/apps/studio/package.json
          sparse-checkout-cone-mode: false

      - name: Name the tags
        id: tags
        env:
          ALI_REGISTRY: ${{ secrets.ALI_DOCKER_PUBLIC_REGISTRY }}
          TAG: ${{ inputs.tag }}
        run: |
          manifest=packages/apps/studio/package.json
          version=$(jq -r '.version // empty' "$manifest" 2>/dev/null || true)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG has no valid version in $manifest (found '${version}'), so a release image cannot be tagged."
            exit 1
          fi
          case "$version" in
            *-*) channel=beta ;;
            *) channel=latest ;;
          esac
          tags=
          for image in nocobase/studio "$ALI_REGISTRY/nocobase/studio"; do
            tags="${tags}${image}:${version}"$'\n'"${image}:${channel}"$'\n'
          done
          {
            echo "version=${version}"
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build the Studio image (${{ matrix.platform }})
    needs: tags
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            target: linux-x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    outputs:
      # One output per architecture, so `publish` can read both digests of the matrix.
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        run: pnpm --filter "@nocobase/studio^..." build

      # dist/ is built here, with this job's heap, and the image takes it prebuilt. It includes dist/runners, the
      # runner and nb-studio packages Studio serves. The target has to be this image's architecture: the Dockerfile
      # checks the target dist/package.json records against the image and fails on any other.
      - name: Build dist for ${{ matrix.target }}
        working-directory: packages/apps/studio
        env:
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD: '1'
          TARGET: ${{ matrix.target }}
        run: pnpm build --target "$TARGET"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushed to Docker Hub by digest only, with no tag: nothing can pull this single-architecture image by name.
      # `publish` puts the tags on the multi-architecture image, on Docker Hub and on Aliyun's public registry.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/apps/studio
          file: packages/apps/studio/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: DIST=prebuilt
          outputs: type=image,name=nocobase/studio,push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Record the digest
        id: digest
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest-${PLATFORM#linux/}=${DIGEST}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the Studio image
    needs: [tags, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to Aliyun's public registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_PUBLIC_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One manifest list over both architectures, written under every tag; imagetools copies the layers from Docker
      # Hub to Aliyun's registry as it goes.
      - name: Tag the multi-architecture image
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          AMD64: ${{ needs.image.outputs.digest-amd64 }}
          ARM64: ${{ needs.image.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          for digest in "$AMD64" "$ARM64"; do
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::An architecture's image digest is missing or malformed ('${digest}')."
              exit 1
            fi
          done
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "nocobase/studio@${AMD64}" "nocobase/studio@${ARM64}"
          docker buildx imagetools inspect "$(head -n 1 <<< "$TAGS")"

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.tags.outputs.version }}
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          {
            echo '### Studio image'
            echo
            echo "Built \`@nocobase/studio@${VERSION}\` from \`${TAG}\` for linux/amd64 and linux/arm64:"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
