# This default-branch entry dispatches the implementation from the isolated v3 branch.
name: V3 Studio image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Aggregate release tag to build, e.g. release-beta/2026-10-11.1'
        type: string
        required: true
      update_beta_or_latest:
        description: Besides :<version>, also point :beta (or :latest for a stable version) at this image. Leave off when rebuilding an older release
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    name: Run the v3 implementation
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on v3-develop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: v3-studio-image.yml
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: >
          printf '%s' "$DISPATCH_INPUTS" \
            | jq '{ref: "v3-develop", inputs: with_entries(.value |= tostring)}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" --input -
          echo "Dispatched $WORKFLOW_FILE on v3-develop. Check that workflow run for its result." >>
          "$GITHUB_STEP_SUMMARY"
