name: V2 workflow entries

# The default branch (currently v3, formerly v3-develop) carries one thin entry per manual (workflow_dispatch) workflow in this
# directory, with the same filename, name and inputs, so those workflows stay runnable from the default branch. This
# check fails a pull request that adds, removes or renames a manual workflow, or changes its name or inputs, while the
# entry on the default branch does not match. To change a manual workflow, update the entry on the default branch first,
# then this branch. A workflow that has never run can instead be added to EXCLUDED in
# scripts/check-v2-workflow-entries.mjs on the default branch. v3 workflows (v3-*.yml) live on the default branch itself
# and are not compared. The default branch is read from the event, so a rename needs no change here.
# This workflow has no workflow_dispatch trigger, so it needs no entry itself.

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: v2-workflow-entries-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: V2 workflow entries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out this pull request's workflows
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows

      - name: Check out the entries on the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: default-branch
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/check-v2-workflow-entries.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yaml next to the script
        run: |
          script=default-branch/scripts/check-v2-workflow-entries.mjs
          if [ ! -f "$script" ]; then
            echo "::error::scripts/check-v2-workflow-entries.mjs does not exist on the default branch $DEFAULT_BRANCH. It is added there by the v3-v2-workflow-entries check; merge that first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/check"
          cp "$script" "$RUNNER_TEMP/check/"
          npm install --prefix "$RUNNER_TEMP/check" --no-save --no-package-lock --no-audit --no-fund yaml@2.9.0

      - name: Compare this pull request with the entries on the default branch
        run: >
          node "$RUNNER_TEMP/check/check-v2-workflow-entries.mjs"
          --main .github/workflows
          --entries default-branch/.github/workflows
          --mismatch error
