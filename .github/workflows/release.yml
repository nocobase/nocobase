# This default-branch entry dispatches the v1/v2 implementation on main so that it stays runnable from the default branch.
# To run it on another branch (next, develop, v1 or a feature branch), select that branch in "Use workflow from": GitHub then runs that branch's own release.yml directly.
# Keep the name and the workflow_dispatch inputs in sync with release.yml on main; see .github/V3-MIGRATION.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag to release. Must start with v, for example v2.1.0-alpha.30
        required: true
        type: string
      skip_publish_npm:
        description: Skip publishing to npmjs.org
        required: false
        default: false
        type: boolean
      skip_publish_pkg:
        description: Skip publishing to pkg.nocobase.com
        required: false
        default: false
        type: boolean
      skip_publish_pkg_src:
        description: Skip publishing to pkg-src.nocobase.com
        required: false
        default: false
        type: boolean
      skip_publish_docker:
        description: Skip publishing Docker images
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    name: Run the v1/v2 implementation
    if: ${{ github.ref == 'refs/heads/v3-develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: release.yml
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: >
          printf '%s' "$DISPATCH_INPUTS" \
            | jq '{ref: "main", inputs: ((. // {}) | with_entries(.value |= tostring))}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" --input -
          echo "Dispatched $WORKFLOW_FILE on main. Check that workflow run for its result." >>
          "$GITHUB_STEP_SUMMARY"
