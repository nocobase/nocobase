name: Prepare PR 10467 review commit
on:
  push:
    branches: [verify/pr-10467-review-writeback]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3
      - name: Apply reviewed patch
        run: |
          python3 - <<'PY'
          import base64, zlib, subprocess
          patch = ''
          subprocess.run(['git', 'apply', '-'], input=zlib.decompress(base64.b64decode(patch)), check=True)
          PY
      - name: Format changed files
        run: npx --yes --package=prettier@3.6.2 prettier --write packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts
      - name: Create clean source commit
        run: |
          git diff --check
          git add packages/plugins/@nocobase/plugin-flow-engine/src/server/variables/allow-list.ts packages/plugins/@nocobase/plugin-flow-engine/src/server/__tests__/variables.allow-list.test.ts
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: preserve target variables in reference events' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p 6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3)
          git push origin "$commit:refs/heads/verify/pr-10467-review-candidate-${{ github.run_id }}"
          printf '%s\n%s\n' "$commit" "$tree" > /tmp/pr10467-review-writeback.txt
          git diff --stat 6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3 "$commit" >> /tmp/pr10467-review-writeback.txt
          git diff 6a3c95ed3f4da3ecab57ca49c0b65dd25b4c6ef3 "$commit" > /tmp/pr10467-review-writeback.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr10467-review-writeback
          path: /tmp/pr10467-review-writeback.*
          retention-days: 7
