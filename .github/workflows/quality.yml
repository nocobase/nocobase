name: Quality

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        run: pnpm dev-config:build

      # ESLint is run per package rather than over one list of every changed file. The type-aware rules build a
      # TypeScript program per file and hold it for the length of the run, so a single process grows with the size of
      # the change: a repository-wide refactor touching a couple of thousand files exhausts the runner's heap and the
      # job dies with an allocation failure instead of a lint result. One process per package bounds that, because
      # each exits and frees what it held. `--filter "[$BASE_SHA]"` selects exactly the packages the diff touched, so
      # an ordinary pull request still lints only what it changed.
      #
      # Prettier keeps taking every changed file at once. It parses and prints one file at a time without any
      # cross-file analysis, so its memory does not scale the same way — the same diff that kills ESLint peaks well
      # under half a gigabyte here.
      - name: Check changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          # Files outside any package: the root ESLint configuration covers `scripts/`, `tests/`, and the root
          # `.js`/`.mjs`/`.cjs` files, but no package owns them, so the per-package run below never reaches them.
          root_files=()
          prettier_files=()

          while IFS= read -r -d '' file; do
            case "$file" in
              packages/*) ;;
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts) root_files+=("$file") ;;
            esac

            case "$file" in
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts|*.json|*.json5|*.jsonc|*.md|*.mdx|*.yml|*.yaml|*.css|*.scss|*.less|*.html)
                prettier_files+=("$file")
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")

          if ((${#root_files[@]})); then
            pnpm exec eslint --no-warn-ignored --max-warnings 0 -- "${root_files[@]}"
          fi

          pnpm --filter "[$BASE_SHA]" --if-present lint

          if ((${#prettier_files[@]})); then
            pnpm exec prettier --check --ignore-path .prettierignore -- "${prettier_files[@]}"
          fi

  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
            peers_check: true
            deps_check: true
          - name: Test
            script: test
            peers_check: false
            deps_check: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the matrix script because a misdeclared dependency is decided by reading manifests, and reporting it
      # in seconds is more useful than reporting it after a full typecheck.
      - name: Check peer dependencies
        if: ${{ matrix.peers_check }}
        run: pnpm peers:check

      # Same reasoning: a dependency declared in the wrong place is decided by reading manifests and sources, and it
      # otherwise surfaces only once a published package is installed somewhere its devDependencies are absent.
      - name: Check runtime dependencies
        if: ${{ matrix.deps_check }}
        run: pnpm deps:check

      - name: ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check package tarballs
        env:
          PACK_DIR: ${{ runner.temp }}/nocobase-pack-check
        run: pnpm pack:check

      - name: Upload checked package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  create-app-smoke:
    name: Create-app smoke (${{ matrix.template }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [default, examples, hub]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download checked package tarballs
        uses: actions/download-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check

      # Each runner installs the exact tarballs checked by Build into its own registry. Workspace package names have
      # no upstream fallback, so an already-published version cannot hide a broken artifact from this checkout.
      - name: Verify create-app against the checked packages
        uses: ./.github/actions/verify-create-app
        with:
          local-packages-only: 'true'
          template-kind: ${{ matrix.template }}
          package-artifacts: ${{ runner.temp }}/nocobase-pack-check

  app-installer-smoke:
    name: app-installer smoke (Hub template)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ROOT: /tmp/hub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pm2
        run: npm install -g pm2

      - name: Download checked package tarballs
        uses: actions/download-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check

      # The installer and the Hub template both come from this checkout's tarballs, so a change to either is tested
      # against the other as it will ship. The published Hub is covered by the daily run in app-installer-smoke.yml.
      - name: Start a registry holding this checkout's packages
        id: registry
        uses: ./.github/actions/local-registry
        with:
          package-artifacts: ${{ runner.temp }}/nocobase-pack-check
          latest: |
            @nocobase/create-app
            @nocobase/app-template-hub
            @nocobase/app-installer

      # The same script backs `pnpm unreleased:installer-smoke`: install, check, rebuild, upgrade from a copy registered
      # as an older release, roll back, restore, and roll back automatically from a release that fails to start.
      - name: Install, upgrade and roll back a Hub
        env:
          NOCOBASE_REGISTRY: ${{ steps.registry.outputs.registry }}
          NPM_CONFIG_USERCONFIG: ${{ steps.registry.outputs.npmrc }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          VERSION=$(node -p "require('./packages/tools/app-installer/package.json').version")
          node scripts/smoke-app-installer.mjs --source template --root "$APP_ROOT" --port 13000 -- \
            npx --yes --registry="$REGISTRY" "@nocobase/app-installer@$VERSION"

      - name: Show logs
        if: failure()
        run: |
          tail -n 200 "$APP_ROOT"/logs/*.log || true
          pm2 logs --nostream --lines 100 || true

      - name: Stop the registry
        if: always()
        run: docker rm -f local-registry > /dev/null 2>&1 || true

  db-integration-plan:
    name: Select DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      databases: ${{ steps.select.outputs.databases }}
      should_run: ${{ steps.select.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select affected databases
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/select-db-integration-matrix.mjs

  db-integration:
    name: DB integration (${{ matrix.database }})
    needs: db-integration-plan
    if: ${{ needs.db-integration-plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.db-integration-plan.outputs.databases) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        run: pnpm dev-config:build

      - name: Test ${{ matrix.database }}
        run: pnpm --filter @nocobase/db-${{ matrix.database }} test:integration

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - changed-files
      - validation
      - build
      - create-app-smoke
      - app-installer-smoke
      - db-integration-plan
      - db-integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel jobs
        env:
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CREATE_APP_SMOKE_RESULT: ${{ needs['create-app-smoke'].result }}
          APP_INSTALLER_SMOKE_RESULT: ${{ needs['app-installer-smoke'].result }}
          DB_PLAN_RESULT: ${{ needs['db-integration-plan'].result }}
          DB_SHOULD_RUN: ${{ needs['db-integration-plan'].outputs.should_run }}
          DB_INTEGRATION_RESULT: ${{ needs['db-integration'].result }}
        run: |
          if [[ "$CHANGED_FILES_RESULT" != "success" || "$VALIDATION_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$CREATE_APP_SMOKE_RESULT" != "success" || "$APP_INSTALLER_SMOKE_RESULT" != "success" || "$DB_PLAN_RESULT" != "success" ]]; then
            echo "One or more quality jobs failed or were cancelled."
            exit 1
          fi

          # Only accept a skipped matrix when the successful planner explicitly selected no databases.
          if [[ "$DB_SHOULD_RUN" == "false" && "$DB_INTEGRATION_RESULT" == "skipped" ]]; then
            echo "No database integration tests required."
          elif [[ "$DB_SHOULD_RUN" != "true" || "$DB_INTEGRATION_RESULT" != "success" ]]; then
            echo "Database integration tests failed, were cancelled, or were unexpectedly skipped."
            exit 1
          fi
