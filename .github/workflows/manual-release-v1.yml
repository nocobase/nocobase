# This default-branch entry dispatches the v1/v2 implementation on main so that it stays runnable from the default branch.
# To run it on another branch (next, develop, v1 or a feature branch), select that branch in "Use workflow from": GitHub then runs that branch's own manual-release-v1.yml directly.
# Keep the name and the workflow_dispatch inputs in sync with manual-release-v1.yml on main; see .github/V3-MIGRATION.md.
name: Manual release v1.x
on:
  workflow_dispatch:
    inputs:
      version:
        description: specify a version (e.g. 1.9.48)
        type: string
        required: false
      is_feat:
        description: is feat (minor bump behavior, see release.sh)
        type: boolean
        required: false
      dry_run:
        description: If true, do not build, commit, tag, or push. Only compute version + validate tag conflicts and print a plan.
        type: boolean
        required: false
        default: false
      skip_install_build:
        description: skip yarn install and build
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    name: Run the v1/v2 implementation
    if: ${{ github.ref == 'refs/heads/v3-develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: manual-release-v1.yml
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: >
          printf '%s' "$DISPATCH_INPUTS" \
            | jq '{ref: "main", inputs: ((. // {}) | with_entries(.value |= tostring))}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" --input -
          echo "Dispatched $WORKFLOW_FILE on main. Check that workflow run for its result." >>
          "$GITHUB_STEP_SUMMARY"
