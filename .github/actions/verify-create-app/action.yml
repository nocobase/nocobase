name: Verify create-app
description: >-
  Publishes packages to a throwaway registry, generates Default and Examples applications with create-app, and checks test,
  dev, build, and production start. Fails the run before anything reaches the real registry.

inputs:
  port:
    description: Port the throwaway registry listens on.
    default: '4873'
  timeout:
    description: Seconds to wait for each dev and production server to become ready.
    default: '420'
  local-packages-only:
    description: Disable upstream resolution for workspace packages so PRs test their own artifacts at committed versions.
    default: 'false'
  template-kind:
    description: Template to verify (default, examples, or all).
    default: all
  package-artifacts:
    description: Directory containing the complete set of tarballs produced by pack:check. Empty uses changeset publish.
    default: ''
  source-directory:
    description: Checkout containing the package versions being verified, relative to the workflow workspace.
    default: '.'

runs:
  using: composite
  steps:
    - name: Validate smoke-test inputs and package artifacts
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        ARTIFACTS: ${{ inputs.package-artifacts }}
        LOCAL_PACKAGES_ONLY: ${{ inputs.local-packages-only }}
        PORT: ${{ inputs.port }}
        TEMPLATE_KIND: ${{ inputs.template-kind }}
      run: |
        set -euo pipefail
        case "$TEMPLATE_KIND" in
          all|default|examples) ;;
          *)
            echo "::error::template-kind must be all, default, or examples; received '$TEMPLATE_KIND'"
            exit 2
            ;;
        esac

        if [ -n "$ARTIFACTS" ]; then
          if [ "$LOCAL_PACKAGES_ONLY" != 'true' ]; then
            echo "::error::package-artifacts requires local-packages-only=true so missing packages cannot resolve upstream"
            exit 2
          fi
          node "$GITHUB_WORKSPACE/scripts/publish-pack-artifacts.mjs" \
            --artifacts "$ARTIFACTS" \
            --repo-root "$PWD" \
            --registry "http://localhost:$PORT/" \
            --validate-only
        fi

    # The registry runs as a plain container rather than a job service so it can be handed a configuration file. A
    # service container has no way to mount one, and the alternative — starting it with the defaults and rewriting the
    # configuration through docker exec afterwards — keeps the settings that matter somewhere other than the file that
    # describes them.
    - name: Start the throwaway registry
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        PORT: ${{ inputs.port }}
        LOCAL_PACKAGES_ONLY: ${{ inputs.local-packages-only }}
      run: |
        set -euo pipefail
        CONFIG="$GITHUB_WORKSPACE/.github/verdaccio/config.yaml"
        if [ "$LOCAL_PACKAGES_ONLY" = 'true' ]; then
          CONFIG="$RUNNER_TEMP/smoke-verdaccio.yaml"
          node "$GITHUB_WORKSPACE/scripts/smoke-registry-config.mjs" > "$CONFIG"
        fi
        docker run -d --name release-verdaccio \
          -p "127.0.0.1:$PORT:4873" \
          -v "$CONFIG:/verdaccio/conf/config.yaml:ro" \
          verdaccio/verdaccio:5

        for _ in $(seq 1 60); do
          if curl -fsS --max-time 5 "http://localhost:$PORT/-/ping" -o /dev/null 2>/dev/null; then
            echo "Registry is up on port $PORT"
            exit 0
          fi
          sleep 1
        done

        echo "::error::The throwaway registry did not start"
        docker logs release-verdaccio
        exit 1

    # Registering over HTTP rather than driving `npm adduser` through expect: the endpoint returns the token directly,
    # so nothing has to be installed on the runner and there is no interactive prompt to keep in step.
    #
    # Basic auth is sent along with the registration. A fresh container has no such user and returns the token from
    # the registration itself; a container that already has one answers 409 to an anonymous request but 201 with a
    # token when the credentials are presented. Sending them always covers both without branching on the status.
    - name: Authenticate against the throwaway registry
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        TOKEN=$(curl -fsS -X PUT \
          -H 'Content-Type: application/json' \
          -u release-ci:release-ci \
          -d '{"name":"release-ci","password":"release-ci","type":"user","roles":[]}' \
          "http://localhost:$PORT/-/user/org.couchdb.user:release-ci" \
          | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).token??""))')

        if [ -z "$TOKEN" ]; then
          echo "::error::The throwaway registry issued no token"
          exit 1
        fi
        echo "::add-mask::$TOKEN"

        # A separate file, used only by the steps below through a step-level NPM_CONFIG_USERCONFIG. The npm
        # configuration the rest of the release reads is never modified, so no amount of forgetting to clean up can
        # redirect the real publish.
        #
        # An earlier version wrote into that shared file and removed the token again afterwards. It missed the
        # scoped-registry line it had also added, and `changeset publish` then looked for every package on a registry
        # whose container had already been destroyed. Cleaning up correctly is a thing to get right every time;
        # not writing there at all is a thing to get right once.
        SMOKE_NPMRC="$RUNNER_TEMP/smoke-npmrc"
        cp "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$SMOKE_NPMRC" 2>/dev/null || : > "$SMOKE_NPMRC"
        echo "smoke_npmrc=$SMOKE_NPMRC" >> "$GITHUB_ENV"

        # `npm config set` rather than appending with `>>`. setup-node writes its file without a trailing newline, so
        # an appended line joins the last one — `always-auth=false//localhost:4873/:_authToken=...` parses as a value
        # for always-auth and the credential silently does not exist. npm parses and rewrites the whole file, so the
        # newline is its problem rather than ours.
        NPM_CONFIG_USERCONFIG="$SMOKE_NPMRC" npm config set "//localhost:$PORT/:_authToken=$TOKEN"

        # A scoped registry outranks the global one and does not appear in `config get registry`, so an inherited
        # @nocobase:registry would send this publish to the real registry with every check here passing. Setting it
        # in the isolated file removes that possibility for the smoke test without touching what follows it.
        NPM_CONFIG_USERCONFIG="$SMOKE_NPMRC" npm config set "@nocobase:registry=http://localhost:$PORT/"

    # Environment variables rather than an .npmrc edit: the repository is mid-release and its whole working tree is
    # about to be committed, so nothing tracked can be touched, and a variable that only exists for this step cannot
    # leak into the real publish further down.
    #
    # Both spellings are needed, and this is the step where getting it wrong is expensive. changesets asks `npm info`
    # whether a version is already published and then hands the publish to `pnpm publish` — and pnpm 11 does not read
    # npm_config_* at all, it reads PNPM_CONFIG_<SETTING>. Setting only the npm form points the check at the throwaway
    # registry while the publish goes to the real one, which is the exact accident this whole job exists to prevent.
    # The assertion below is there because that failure would otherwise look like a successful smoke test.
    #
    # --no-git-tag because the tags belong to the real publish. Creating them here would leave the second publish
    # trying to create tags that already exist.
    - name: Publish packages to the throwaway registry
      if: inputs.package-artifacts == ''
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        LOCAL="http://localhost:$PORT/"

        export NPM_CONFIG_USERCONFIG="$smoke_npmrc"
        export PNPM_CONFIG_REGISTRY="$LOCAL"
        export npm_config_registry="$LOCAL"
        export NPM_CONFIG_REGISTRY="$LOCAL"
        # setup-node's .npmrc interpolates this; leaving it unset would make npm fail to read its own configuration.
        export NODE_AUTH_TOKEN=''

        # Both the global registry and the @nocobase scope, because the scope is what actually decides where these
        # packages go and it is invisible to a check that only reads the global value.
        for tool in pnpm npm; do
          for setting in registry @nocobase:registry; do
            RESOLVED="$("$tool" config get "$setting" | tr -d '\r' | tail -1)"
            if [ "$RESOLVED" != "$LOCAL" ] && [ "$RESOLVED" != "${LOCAL%/}" ]; then
              echo "::error::$tool resolves $setting to '$RESOLVED' instead of '$LOCAL'. Publishing now would reach the real registry."
              exit 1
            fi
            echo "$tool $setting -> $RESOLVED"
          done
        done

        pnpm changeset publish --no-git-tag

    - name: Publish package artifacts to the throwaway registry
      if: inputs.package-artifacts != ''
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        ARTIFACTS: ${{ inputs.package-artifacts }}
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        LOCAL="http://localhost:$PORT/"

        export NPM_CONFIG_USERCONFIG="$smoke_npmrc"
        export PNPM_CONFIG_REGISTRY="$LOCAL"
        export npm_config_registry="$LOCAL"
        export NPM_CONFIG_REGISTRY="$LOCAL"
        export NODE_AUTH_TOKEN=''

        # Check both tools and both registry settings before publishing. The generated application uses pnpm, while
        # the exact tarballs are sent with npm; a scoped registry overrides the global one for every workspace package.
        for tool in pnpm npm; do
          for setting in registry @nocobase:registry; do
            RESOLVED="$("$tool" config get "$setting" | tr -d '\r' | tail -1)"
            if [ "$RESOLVED" != "$LOCAL" ] && [ "$RESOLVED" != "${LOCAL%/}" ]; then
              echo "::error::$tool resolves $setting to '$RESOLVED' instead of '$LOCAL'. Publishing now would reach the wrong registry."
              exit 1
            fi
            echo "$tool $setting -> $RESOLVED"
          done
        done

        # This publishes the pack:check output itself. npm must not repack a workspace or run package lifecycle scripts.
        node "$GITHUB_WORKSPACE/scripts/publish-pack-artifacts.mjs" \
          --artifacts "$ARTIFACTS" \
          --repo-root "$PWD" \
          --registry "$LOCAL"

    - name: Generate selected applications and verify test, dev, build, and start
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        PORT: ${{ inputs.port }}
        TEMPLATE_KIND: ${{ inputs.template-kind }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        export NPM_CONFIG_USERCONFIG="$smoke_npmrc"

        CREATE_APP_VERSION=$(node -p "require('./packages/tools/create-app/package.json').version")

        # Outside the checkout on purpose. The generated application writes its own pnpm-workspace.yaml, which would
        # make pnpm treat it as a workspace root nested inside this one, and the release commit stages everything in
        # the working tree — a generated application there would be committed and published.
        # Each template has its own dependency graph: workspace tests cannot prove that its published declarations resolve.
        if [ "$TEMPLATE_KIND" = 'all' ]; then
          TEMPLATE_KINDS=(default examples)
        else
          TEMPLATE_KINDS=("$TEMPLATE_KIND")
        fi
        for CURRENT_TEMPLATE_KIND in "${TEMPLATE_KINDS[@]}"; do
          TEMPLATE_VERSION=$(node -p "require('./packages/templates/app-template-$CURRENT_TEMPLATE_KIND/package.json').version")
          "$GITHUB_WORKSPACE/scripts/smoke-create-app.sh" \
            --registry "http://localhost:$PORT" \
            --create-app-version "$CREATE_APP_VERSION" \
            --template "@nocobase/app-template-$CURRENT_TEMPLATE_KIND@$TEMPLATE_VERSION" \
            --timeout "$TIMEOUT" \
            --workdir "$RUNNER_TEMP/create-app-smoke/$CURRENT_TEMPLATE_KIND"
        done

    - name: Upload smoke logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.template-kind == 'all' && 'create-app-smoke-logs' || format('create-app-smoke-{0}-logs', inputs.template-kind) }}
        path: ${{ runner.temp }}/create-app-smoke/**/*.log
        if-no-files-found: ignore

    - name: Stop the throwaway registry
      if: always()
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        if [ "${RUNNER_DEBUG:-}" = "1" ]; then
          docker logs release-verdaccio || true
        fi
        docker rm -f release-verdaccio > /dev/null 2>&1 || true

        # One file to remove, rather than specific lines to remember to remove from a file the release still needs.
        rm -f "${smoke_npmrc:-}"

        # The release publishes for real after this action returns, so prove the configuration it will read carries
        # nothing pointing at a registry that no longer exists. This is the failure that reached a release once: a
        # leftover @nocobase:registry sent `changeset publish` to a destroyed container.
        SHARED="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        if [ -f "$SHARED" ] && grep -q "localhost:$PORT" "$SHARED"; then
          echo "::error::$SHARED still refers to the throwaway registry. The publish that follows would fail or reach the wrong registry."
          grep -n "localhost:$PORT" "$SHARED" | sed 's/_authToken=.*/_authToken=<redacted>/'
          exit 1
        fi
