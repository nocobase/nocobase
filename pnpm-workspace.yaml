# Which dependencies may run install scripts: true compiles a native addon, false skips a script
# nothing here needs. tesseract.js arrives through officeparser and its postinstall only prints a
# donation notice. A package left out entirely stops the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  # Ships prebuilt binaries for every platform NocoBase supports and loads them first. Its implicit
  # node-gyp build compiles nothing when one matches, yet still fails on a machine without make.
  better-sqlite3: false
  oracledb: true
  esbuild: true
  tesseract.js: false
  # Pulled in by @iconscout/unicons, the icon font the documentation site uses. Its build script only runs when
  # unicons regenerates its own fonts; the .woff2 files ship in the published package, so compiling the native addon
  # at install time produces nothing anything reads.
  ttf2woff2: false
  '@parcel/watcher': false
  '@biomejs/biome': true
  '@swc/core': true

# Use msgpackr without its optional native accelerator or platform binary packages.
ignoredOptionalDependencies:
  - msgpackr-extract

# Reports a dependency whose install script was skipped as a warning instead of failing the install.
# allowBuilds decides the packages known today; this keeps a newly introduced transitive dependency
# from breaking every install until someone adds its entry.
# See https://pnpm.io/settings/build#strictdepbuilds.
strictDepBuilds: false

minimumReleaseAgeExclude:
  - '@publint/pack@0.1.7'
  - publint@0.3.24
  - '@gchust/agent-annotations@0.1.9'
  - eslint-plugin-react-refresh@0.5.6
