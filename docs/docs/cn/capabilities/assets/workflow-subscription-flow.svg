<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">订阅续费流程</title><desc id="desc">等待到期，再续费；失败后按规则重试</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans SC, Microsoft YaHei, sans-serif">
