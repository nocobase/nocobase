<rect x="360" y="152" width="220" height="64" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="470.0" y="191" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">服务生效</text>
<rect x="730" y="152" width="220" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="840.0" y="191" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">到期续费</text>
<rect x="730" y="310" width="220" height="64" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="840.0" y="349" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">欠费待重试</text>
<rect x="360" y="310" width="220" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
