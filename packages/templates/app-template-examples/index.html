<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="NocoBase administration console" />
    <meta data-rh="true" property="og:image" content="/assets/logo-mark.png" />
    <meta data-rh="true" name="twitter:image" content="/assets/logo-mark.png" />
    <style>
      .app-bootstrap-loading {
        display: flex;
        min-height: 100svh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: oklch(0.985 0 0);
        color: oklch(0.18 0 0);
      }

      .app-bootstrap-loading [data-slot='loading-indicator'] {
        width: 1.75rem;
        height: 1.75rem;
        opacity: 0;
        animation:
          app-bootstrap-reveal 0s 200ms forwards,
          app-bootstrap-spin 1s linear 200ms infinite;
      }

      html,
      body {
        margin: 0;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-bootstrap-reveal {
        to {
          opacity: 1;
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-loading {
          background: oklch(0.145 0 0);
          color: oklch(0.9 0 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-loading [data-slot='loading-indicator'] {
          animation: none;
          opacity: 0.65;
        }
      }
    </style>
    <title>NocoBase</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        class="app-bootstrap-loading"
        role="status"
        aria-label="Loading application"
      >
        <svg
          data-slot="loading-indicator"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M21 12a9 9 0 1 1-6.219-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/client/index.tsx"></script>

      To begin development, run `pnpm dev`.
      To create a production bundle, run `pnpm build`.
    -->
  </body>
</html>
