    <style>
      .app-bootstrap-loading {
        display: flex;
        min-height: 100svh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: oklch(0.985 0 0);
        color: #002ad1;
        flex-direction: column;
        gap: 0.75rem;
        font:
          14px system-ui,
          sans-serif;
      }

      .app-bootstrap-loading [data-slot='loading-indicator'] {
        width: 3rem;
        height: 3rem;
      }
      .app-bootstrap-loading .nocobase-loading-orbit {
        transform-origin: 32px 32px;
        animation: app-bootstrap-spin 1.1s linear infinite;
      }
      .app-bootstrap-loading span {
        color: oklch(0.556 0 0);
      }

      html,
      body {
        margin: 0;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-bootstrap-reveal {
        to {
          opacity: 1;
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-loading {
          background: oklch(0.145 0 0);
          color: #8ca9ff;
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-loading span {
          color: oklch(0.708 0 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-loading .nocobase-loading-orbit {
          animation: none;
        }
      }
    </style>
