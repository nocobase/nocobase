# Renamed by create-app; keeping this inert lets the template pack within the OSS workspace.
packages:
  - apps/*
verifyDepsBeforeRun: false
strictDepBuilds: false
allowBuilds:
  better-sqlite3: false
  esbuild: true
  oracledb: true
  tesseract.js: false
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@mongodb-js/zstd': false
  node-liblzma: false
ignoredOptionalDependencies:
  - msgpackr-extract
