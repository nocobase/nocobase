services:
  mysql:
    image: mysql:8.4
    ports:
      - '0:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: nocobase
      MYSQL_PASSWORD: nocobase
      MYSQL_DATABASE: nocobase_collection_builder
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -unocobase -pnocobase --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  # The oldest maintained MariaDB LTS that has JSON_OVERLAPS, which the JSON filters need (10.9 and later).
  mariadb:
    image: mariadb:10.11
    ports:
      - '0:3306'
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: nocobase
      MARIADB_PASSWORD: nocobase
      MARIADB_DATABASE: nocobase_collection_builder
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
