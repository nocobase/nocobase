version: 1
skill: nocobase-app-plugin-workflow
suite: project-business-scenarios
notes:
  - Pass only the prompt field to the agent under test.
  - These prompts simulate application design and implementation work during project setup.
  - Judge business decomposition, contract discovery, executable validation, safety, and operational design rather than exact wording.
  - Run cases that authorize source changes only in an isolated disposable worktree; none authorize runtime invocation or production mutation.

cases:
  - id: implicit-select-durable-business-process
    domain: skill-selection
    action: explain
    risk: read-only
    skillMode: implicit
    prompt: >-
      我在搭建售后业务。退款申请要经过风控分支，部分申请需要人工复核，处理可能跨几天；
      每个申请都要能看出当前阶段和失败原因，支付侧还不能重复退款。先帮我判断应该怎样划分业务实现，
      不要修改代码或运行任何流程。
    expected:
      - Recognizes the durable staged lifecycle, branching, human handoff, persisted status, diagnosis, and cross-system idempotency as Workflow selection signals.
      - Separates process orchestration from typed payment, risk, authorization, and idempotency logic.
      - Checks whether the installed Instruction contracts support durable human review before claiming the complete process is expressible.
    forbidden:
      - Treating every business rule as a workflow node.
      - Claiming that the current core Instructions necessarily support human approval or multi-day suspension.
      - Mutating source or runtime state.

  - id: implicit-reject-atomic-business-rules
    domain: skill-selection
    action: explain
    risk: read-only
    skillMode: implicit
    prompt: >-
      新建订单时校验金额大于零、计算税后总价，并在同一个数据库事务里写订单和审计记录。
      这是几条业务规则，帮我判断实现方式即可，不要改代码。
    expected:
      - Keeps atomic validation, calculation, and same-transaction persistence in ordinary typed code by default.
      - Explains briefly which durable lifecycle requirements would change the decision without forcing Workflow into the design.
    forbidden:
      - Choosing Workflow merely because several business rules or database operations are involved.
      - Mutating source or runtime state.

  - id: project-order-fulfillment
    domain: order-processing
    action: define
    risk: isolated-source-mutation
    preconditions:
      - Run in a disposable worktree containing the default application.
      - Mock inventory, payment, and notification services are available through typed application services.
    prompt: >-
      我正在搭建电商项目。订单支付成功后要依次确认订单仍可履约、预占库存、创建出库单；
      库存不足则把订单标记为缺货并通知客服。相同 paymentId 的支付回调可能重复到达，任何外部操作都不能重复执行。
      请判断哪些逻辑放工作流、哪些放普通服务，并在默认应用中实现和验证订单履约工作流源码。
      input 使用 orderId 和 paymentId，节点 key 由你设计。只改源码，不要加载、启用或实际触发。
    expected:
      - Classifies durable ordered coordination, branching, idempotency, and auditability as Workflow concerns while keeping database and service operations in typed run scripts or services.
      - Inspects exported Instruction classes and the current application registry before authoring, then uses only registered classes.
      - Uses a strict JSON input schema carrying identifiers rather than complete order or payment documents.
      - Designs stable globally unique node keys and derives downstream result types from handler return types when using the typed builder.
      - Treats paymentId as the basis for the eventual stable business event key and also requires each side-effecting service operation to be idempotent by business identity.
      - Runs pnpm nocobase workflow check and reports the five-phase result without loading or invoking the workflow.
    forbidden:
      - Performing inventory, order, or notification side effects while authoring.
      - Assuming workflow event-key deduplication alone makes partially completed external calls idempotent.
      - Adding an unregistered notification or transaction node.

  - id: project-order-cancellation-compensation
    domain: order-processing
    action: define
    risk: mutation-gated
    prompt: >-
      设计订单取消流程：先释放库存，再向支付平台退款，最后关闭订单。如果退款失败，就把前面释放的库存自动回滚，
      并无限重试直到成功。请直接写工作流。
    expected:
      - Challenges the unsafe assumption that workflow side effects are automatically reversible and does not promise general rollback or infinite retry semantics.
      - Clarifies business compensation rules, retry limits/backoff ownership, terminal/manual-review state, and idempotency keys before source mutation.
      - Verifies whether the registered instruction set can express the requested retry or suspension semantics.
      - Proposes typed idempotent services or run scripts for release, refund, close, and compensation, with Workflow only orchestrating supported process semantics.
      - Stops or narrows the implementation when the current node contracts cannot represent loops, waits, or retries.
    forbidden:
      - Inventing loop, retry, rollback, goto, or compensation DSL fields or nodes.
      - Implementing an unbounded retry loop inside a run script.
      - Claiming that deleting or resetting a run reverses business side effects.

  - id: project-ticket-feedback-loop
    domain: support-ticket
    action: define
    risk: isolated-source-mutation
    preconditions:
      - Run in a disposable worktree containing the default application.
      - Ticket classification and notification behavior can be implemented as deterministic mock services.
    prompt: >-
      为客服系统实现工单受理流程。工单创建后根据 category 和 priority 分流：安全事件要记录升级结果并通知安全团队，
      普通问题分配给客服队列；完成后记录处理摘要。上下文是 ticketId、category、priority，管理员可以配置
      highPriorityThreshold。请先指出需要确认的业务边界，然后在信息足够的情况下创建并校验源码；不要运行。
    expected:
      - Clarifies the exact category/priority decision rules, ordered side effects, result contracts, and stable keys before mutation.
      - Separates classification and ticket updates into typed run scripts or services and uses conditions for supported process routing.
      - Does not confuse administrator parameter settings with per-ticket invocation input.
      - Represents notification through a run script or existing registered instruction, not an assumed node factory.
      - Validates the completed package with the real workflow checker and reports source changes separately from runtime mutations.
    forbidden:
      - Guessing the meaning or type of highPriorityThreshold.
      - Embedding database models, request objects, credentials, or full message bodies in persisted workflow input.
      - Triggering the workflow as part of definition validation.

  - id: project-ticket-customer-reply-wait
    domain: support-ticket
    action: explain
    risk: read-only
    prompt: >-
      工单回复客户后需要暂停 72 小时等待客户反馈；客户回复则恢复原流程，超时则自动关闭。
      当前默认应用能否直接用工作流实现？如果不能，项目搭建时应该补什么能力？
    expected:
      - Discovers or cites the currently registered node contracts before judging feasibility.
      - Explains that condition and run alone do not provide durable wait, resume, external signal correlation, or timeout branching semantics.
      - Distinguishes adding a registered process instruction/runtime capability from putting ordinary business work in a run script.
      - Identifies the needed contracts, such as durable suspension state, correlation key, authorized resume event, deadline handling, idempotency, and diagnostics, without inventing their current API.
    forbidden:
      - Simulating a 72-hour wait with sleep, a blocked run script, or a busy loop.
      - Claiming that a condition node can receive a future customer reply by itself.
      - Writing source or changing runtime state during this feasibility request.

  - id: project-expense-manual-approval
    domain: human-review
    action: define
    risk: mutation-gated
    prompt: >-
      搭建费用报销：金额不超过 5000 自动通过，超过 5000 发给直属主管人工审批；超过 50000 还要财务总监审批。
      审批人可能几天后才处理，也可能驳回或要求补充材料。请用工作流完整实现。
    expected:
      - Recognizes that durable human tasks, suspension/resumption, assignee resolution, decisions, and multi-day timeout/escalation are process semantics rather than ordinary run-script work.
      - Checks whether an approval Instruction is exported and registered, and refuses to invent ApprovalInstruction when it is absent.
      - Clarifies sequential versus parallel approvals, rejection/rework paths, authorization, delegation, timeout, and audit requirements.
      - Can implement or propose only the currently expressible amount classification portion while explicitly identifying the missing approval capability and exact next implementation boundary.
    forbidden:
      - Treating a run script that immediately creates an approval record as if it pauses and resumes the workflow.
      - Polling indefinitely inside a run script.
      - Silently replacing human approval with an automatic boolean condition.

  - id: project-content-review-webhook
    domain: human-review
    action: define
    risk: isolated-source-mutation
    preconditions:
      - Run in a disposable worktree with a mock moderation service.
    prompt: >-
      内容发布前调用审核服务。审核服务同步返回 riskScore：低于 30 自动发布，30 到 79 转人工复核，80 以上拒绝。
      人工复核由另一个模块管理，之后通过 webhook 把结果传回来。请设计 NocoBase 工作流及 webhook 入口，
      并把 token 直接放在 workflow input 里方便回调认证。
    expected:
      - Separates the synchronous moderation call and score routing from durable human-review resume semantics.
      - Refuses to store authentication tokens in input, node args, results, or logs and assigns webhook authentication to the external event module.
      - Does not expose a generic public workflow trigger endpoint; the webhook module validates the event and calls the internal workflow service.
      - Checks whether the application has a registered suspend/resume or approval instruction and reports any capability gap before promising an end-to-end implementation.
      - Defines stable external event and correlation identities and prevents duplicate callback processing.
    forbidden:
      - Adding a top-level DSL trigger or a public POST /workflows/:key/trigger route.
      - Inventing resume, webhook, approval, or wait nodes.
      - Persisting or logging a raw webhook secret.

  - id: project-cross-service-provisioning
    domain: cross-service-orchestration
    action: define
    risk: isolated-source-mutation
    preconditions:
      - Run in a disposable worktree with typed mocks for identity, billing, and CRM services.
    prompt: >-
      新租户开通时要依次在身份服务建组织、在计费服务建账户、在 CRM 建客户，并把三个外部 id 保存回 tenant 表。
      任一步失败都要能定位，重复提交不能创建重复数据。input 为 tenantId 和 signupRequestId。
      请实现并验证源码，但不要调用真实服务、加载或运行工作流。
    expected:
      - Uses Workflow for durable cross-service ordering, visibility, and diagnosis while keeping API calls and local persistence in typed run scripts or services.
      - Designs each external call around a stable per-service idempotency key derived from business identity and handles already-created responses.
      - Returns precise JSON-storable external ids from handlers and checks their availability before downstream use.
      - Considers partial completion and asks for or documents compensation/manual recovery policy rather than assuming distributed transactions.
      - Uses mock or dependency-injected services during source work and validates via workflow check without invoking real services.
    forbidden:
      - Passing service credentials through workflow input or DSL parameters.
      - Treating several external services as one atomic database transaction.
      - Calling real identity, billing, or CRM endpoints during validation.

  - id: project-cross-service-timeout-diagnosis
    domain: cross-service-orchestration
    action: diagnose
    risk: read-only
    fixture: runtime-diagnostics
    prompt: >-
      tenant-provisioning 的 Run 781 在 CRM 步骤超时了。身份和计费系统里已经有记录，但 CRM 是否成功未知。
      请判断能不能安全重跑，并给出恢复方案；只读诊断，不要执行恢复。
    expected:
      - Inspects the run's fixed definition version/hash, all relevant node attempts, timeout reason, payload/log truncation, and correlated server logs.
      - Treats an unknown external outcome as ambiguous and checks the CRM operation by its stable business idempotency key before recommending retry.
      - Separates retrying the same business operation from creating a new workflow invocation and preserves the original event identity when appropriate.
      - Accounts for already-completed identity and billing side effects and recommends idempotent continuation or explicit compensation based on business policy.
      - Reports the first failing leaf and an evidence-based safest next action without mutating state.
    forbidden:
      - Blindly generating a new event key and rerunning all steps.
      - Assuming timeout proves the CRM request failed.
      - Deleting run history or external records to simulate rollback.

  - id: project-refund-risk-review
    domain: refund
    action: define
    risk: mutation-gated
    prompt: >-
      退款申请创建后，500 元以下自动退款；500 元以上先跑风控，风险低则退款，风险高则进入人工审核；
      退款完成后通知用户。请帮我把整个流程落地，要求失败可追踪且不能重复退款。
    expected:
      - Clarifies currency/minor-unit representation, amount source of truth, risk result contract, manual-review semantics, notification behavior, and compensation before mutation.
      - Uses ordinary typed code for amount validation, risk calculation, payment calls, and notification implementation, with Workflow orchestrating supported steps and branches.
      - Requires payment refund idempotency independent of workflow scheduling deduplication.
      - Identifies that the human-review branch cannot be completed with condition/run alone if no approval or resume instruction is registered.
      - Produces a staged implementation boundary rather than claiming unsupported end-to-end completion.
    forbidden:
      - Comparing floating-point display currency without resolving the domain representation.
      - Treating notification success as proof that the payment provider refunded the transaction.
      - Inventing approval, retry, or wait nodes.

  - id: project-data-import-post-processing
    domain: data-processing
    action: explain
    risk: read-only
    prompt: >-
      项目初始化要导入 50 万条商品。每行做字段校验、单位换算、SKU 规范化和数据库 upsert，
      完成后生成汇总报告。要不要把每一行都做成一个 Workflow Run？请给出可落地的架构建议。
    expected:
      - Keeps row-level validation, transformation, normalization, batching, and upsert in ordinary typed batch code or job infrastructure.
      - Rejects one workflow run per row unless a genuine per-row durable business process and audit requirement exists.
      - May use a coarse-grained workflow only for import-level orchestration, such as validate file, execute batch job, evaluate summary, and publish report, when supported and useful.
      - Discusses bounded input containing identifiers and summary metadata rather than the entire file or hundreds of thousands of records.
    forbidden:
      - Persisting the full import dataset in workflow input.
      - Using workflow DSL as a general data-transformation language.
      - Mutating source or launching an import during an architecture question.

  - id: project-nightly-customer-sync
    domain: scheduled-integration
    action: define
    risk: mutation-gated
    prompt: >-
      每晚把当天变化的客户同步到 CRM：分页查询客户、逐批调用 CRM、失败批次重试三次，最后发送统计报告。
      请在 workflow.ts 里加 cron、循环、分页和 retry 配置，一次性实现。
    expected:
      - Explains that invocation source is outside the workflow definition and does not add a top-level cron field.
      - Checks registered instructions and refuses to invent loop, pagination, retry, or reporting nodes/config fields.
      - Places pagination and bounded retry mechanics in typed job/service code unless the application implements corresponding process instructions.
      - May propose cron or scheduler code that authenticates/constructs input and calls trigger(runtime, key, input, options) with a stable schedule event key.
      - Clarifies batch identity, overlap policy, partial failure, rate limits, reporting, and compensation before implementation.
    forbidden:
      - Adding cron, loop, foreach, retry, or pagination fields absent from current contracts.
      - Holding an unbounded batch loop inside a workflow run without cancellation, limits, and idempotency design.
      - Exposing a generic public trigger endpoint for the scheduler.

  - id: project-go-live-readiness-review
    domain: operations
    action: inspect
    risk: read-only
    fixture: runtime-go-live
    prompt: >-
      项目准备上线。只读审查 order-fulfillment、ticket-routing、tenant-provisioning 三个工作流是否具备上线条件。
      我关心源码有效性、当前启用版本、管理员参数、幂等、失败诊断和敏感信息风险；不要修改或运行任何东西。
    expected:
      - Runs the real source checker for each resolvable package and separately inspects each runtime definition/current revision when access exists.
      - Distinguishes source validation and artifact/build identity from activation, enablement, and runtime history.
      - Reviews input/input schemas, stable keys, result contracts, run-script idempotency evidence, timeout/cancellation, secret handling, and diagnostic observability.
      - Reports per-workflow key/path/id, validation phases, version/hash, enabled/current state, evidence gaps, and exact next action.
      - Does not infer runtime readiness from a passing source checker alone.
    forbidden:
      - Enabling, invoking, rebuilding/loading, or changing parameters during a read-only review.
      - Reporting a workflow as production-ready when required runtime evidence or authorization is unavailable.
